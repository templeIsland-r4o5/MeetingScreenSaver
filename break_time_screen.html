    <style>

    <script>
        // Global State Variables
        let targetHour = 15;
        let targetMinute = 35;
        let currentTheme = 'pop';

        let scene, camera, renderer, pointLight;
        let themeObjects = [];
        let animFrameId = null;

        let audioCtx = null;
        let isAudioPlaying = false;
        let currentSoundType = 'pop';
        let activeAudioInterval = null;

        function updateClock() {
            const now = new Date();
            
            // Format current time display
            const ch = String(now.getHours()).padStart(2, '0');
            const cm = String(now.getMinutes()).padStart(2, '0');
            const cs = String(now.getSeconds()).padStart(2, '0');
            const timeElem = document.getElementById('currentTimeDisplay');
            if (timeElem) timeElem.innerText = `${ch}:${cm}:${cs}`;

            // Target time calculation
            const target = new Date();
            target.setHours(targetHour, targetMinute, 0, 0);

            let diff = target.getTime() - now.getTime();
            const countElem = document.getElementById('countdownDisplay');
            if (!countElem) return;

            if (diff <= 0) {
                countElem.innerText = "00:00";
            } else {
                const totalSec = Math.floor(diff / 1000);
                const hours = Math.floor(totalSec / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;

                if (hours > 0) {
                    countElem.innerText = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
                } else {
                    countElem.innerText = `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
                }
            }
        }

        function setTargetTime(h, m) {
            targetHour = parseInt(h, 10);
            targetMinute = parseInt(m, 10);
            
            const hStr = String(targetHour).padStart(2, '0');
            const mStr = String(targetMinute).padStart(2, '0');
            const timeStr = `${hStr}:${mStr}`;

            const timeInput = document.getElementById('timeInput');
            if (timeInput) {
                timeInput.value = timeStr;
            }

            const mainMessageText = `${timeStr}から再開します。`;

            const mainMessage = document.getElementById('mainMessage');
            if (mainMessage) {
                mainMessage.innerText = mainMessageText;
            }

            const mainMsgInput = document.getElementById('mainMsgInput');
            if (mainMsgInput) {
                mainMsgInput.value = mainMessageText;
            }

            document.title = `${timeStr}から再開します - 休憩中スクリーン`;

            updateClock();
        }

        function initThreeJS() {
            const canvas = document.getElementById('bgCanvas');
            if (!canvas) return;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Ambient & Directional Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            pointLight = new THREE.PointLight(0xff70a6, 2, 50);
            pointLight.position.set(-10, -10, 10);
            scene.add(pointLight);

            createThemeObjects(currentTheme);
        }

        function clearThemeObjects() {
            themeObjects.forEach(obj => {
                scene.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) {
                        obj.material.forEach(m => m.dispose());
                    } else {
                        obj.material.dispose();
                    }
                }
            });
            themeObjects = [];
        }

        let mousePos = new THREE.Vector2();

        function createThemeObjects(theme) {
            if (!scene) return;
            clearThemeObjects();
            camera.position.z = 30; // Reset camera position for all themes
            const aspectRatio = window.innerWidth / window.innerHeight;

            if (theme === 'pop') {
                const colors = [0xff70a6, 0xff9f1c, 0xffd166, 0x06d6a0, 0x118ab2, 0xa2d2ff];
                const sphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
                const torusGeo = new THREE.TorusGeometry(1.5, 0.5, 16, 32);
                const spreadX = 35 * aspectRatio;
                const spreadY = 35;

                for (let i = 0; i < 35; i++) {
                    const color = colors[i % colors.length];
                    const mat = new THREE.MeshPhongMaterial({
                        color: color,
                        shininess: 90,
                        specular: 0xffffff,
                        transparent: true,
                        opacity: 0.85
                    });

                    const useTorus = (i % 4 === 0);
                    const mesh = new THREE.Mesh(useTorus ? torusGeo : sphereGeo, mat);

                    mesh.position.set(
                        (Math.random() - 0.5) * spreadX,
                        (Math.random() - 0.5) * spreadY,
                        (Math.random() - 0.5) * 30
                    );

                    const scale = 0.6 + Math.random() * 1.2;
                    mesh.scale.set(scale, scale, scale);

                    mesh.userData = {
                        speedY: 0.005 + Math.random() * 0.012,
                        rotX: (Math.random() - 0.5) * 0.02,
                        rotY: (Math.random() - 0.5) * 0.02,
                        initialY: mesh.position.y,
                        floatOffset: Math.random() * Math.PI * 2
                    };

                    scene.add(mesh);
                    themeObjects.push(mesh);
                }
            } else if (theme === 'neon') {
                camera.position.z = 40; // カメラを少し引く
                const spreadX = 30 * aspectRatio;
                const spreadY = 30;

                // 浮遊するワイヤーフレームオブジェクト
                const geoTypes = [
                    new THREE.TorusGeometry(8, 1, 16, 32),
                    new THREE.IcosahedronGeometry(6, 0),
                    new THREE.TorusKnotGeometry(6, 0.8, 100, 8),
                ];
                const colors = [0x42a5f5, 0xd436f7, 0x00f5d4];

                for(let i=0; i<8; i++) {
                    const mat = new THREE.MeshBasicMaterial({
                        color: colors[i % colors.length],
                        wireframe: true,
                        transparent: true,
                        opacity: 0.5 + Math.random() * 0.3
                    });
                    const mesh = new THREE.Mesh(geoTypes[i % geoTypes.length], mat);

                    mesh.position.set(
                        (Math.random() - 0.5) * spreadX,
                        (Math.random() - 0.5) * spreadY,
                        (Math.random() - 0.5) * 20 - 10
                    );

                    const scale = 0.3 + Math.random() * 0.5;
                    mesh.scale.set(scale, scale, scale);

                    mesh.userData = {
                        isWireframeObject: true,
                        rotX: (Math.random() - 0.5) * 0.005,
                        rotY: (Math.random() - 0.5) * 0.005,
                        floatSpeed: 0.01 + Math.random() * 0.02,
                        floatOffset: Math.random() * Math.PI * 2
                    };
                    scene.add(mesh);
                    themeObjects.push(mesh);
                }

                // 流れるグリッド
                const gridSize = 200;
                const gridDivisions = 60;

                const gridMat = new THREE.ShaderMaterial({
                    uniforms: {
                        color: { value: new THREE.Color(0xd436f7) },
                        fadeDistance: { value: 50.0 }
                    },
                    vertexShader: `
                        varying float vDistance;
                        void main() {
                            vDistance = abs(position.z);
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 color;
                        uniform float fadeDistance;
                        varying float vDistance;
                        void main() {
                            float opacity = 1.0 - smoothstep(0.0, fadeDistance, vDistance);
                            gl_FragColor = vec4(color, opacity * 0.2);
                        }
                    `,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });

                const gridHelper1 = new THREE.GridHelper(gridSize, gridDivisions, 0xffffff, 0xffffff);
                gridHelper1.material = gridMat.clone();
                gridHelper1.position.y = -20;
                gridHelper1.userData = { isFlowingGrid: true, speed: 0.2 };
                scene.add(gridHelper1);
                themeObjects.push(gridHelper1);

                const gridHelper2 = new THREE.GridHelper(gridSize, gridDivisions, 0xffffff, 0xffffff);
                gridHelper2.material = gridMat.clone();
                gridHelper2.material.uniforms.color.value = new THREE.Color(0x42a5f5);
                gridHelper2.position.y = -20;
                gridHelper2.position.z = gridSize / 2;
                gridHelper2.userData = { isFlowingGrid: true, speed: 0.2 };
                scene.add(gridHelper2);
                themeObjects.push(gridHelper2);

            } else if (theme === 'biz') {
                const spreadX = 30 * aspectRatio;
                const spreadY = 30;
                // Particle Network
                const particleCount = 120;
                const particlesGeo = new THREE.BufferGeometry();
                const posArray = new Float32Array(particleCount * 3);
                const velocities = [];

                for (let i = 0; i < particleCount; i++) {
                    posArray[i * 3] = (Math.random() - 0.5) * spreadX;
                    posArray[i * 3 + 1] = (Math.random() - 0.5) * spreadY;
                    posArray[i * 3 + 2] = (Math.random() - 0.5) * 30;
                    
                    velocities.push({
                        x: (Math.random() - 0.5) * 0.1,
                        y: (Math.random() - 0.5) * 0.1,
                        z: (Math.random() - 0.5) * 0.1
                    });
                }
                particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
                particlesGeo.userData.velocities = velocities;

                const pMat = new THREE.PointsMaterial({
                    color: 0x818cf8,
                    size: 0.15,
                    transparent: true,
                    opacity: 0.8
                });
                
                const particles = new THREE.Points(particlesGeo, pMat);
                particles.userData.isParticleNetwork = true;
                scene.add(particles);
                themeObjects.push(particles);

                // Lines geometry
                const lineGeo = new THREE.BufferGeometry();
                const lineMat = new THREE.LineBasicMaterial({
                    color: 0x818cf8,
                    transparent: true,
                    opacity: 0.2
                });
                const lines = new THREE.LineSegments(lineGeo, lineMat);
                scene.add(lines);
                themeObjects.push(lines);

                // Add a soft floor grid
                const gridHelper = new THREE.GridHelper(80, 40, 0x818cf8, 0x818cf8);
                gridHelper.position.y = -18;
                gridHelper.material.opacity = 0.1;
                gridHelper.material.transparent = true;
                scene.add(gridHelper);
                themeObjects.push(gridHelper);

            } else if (theme === 'slate') {
                const spreadX = 30 * aspectRatio;
                const spreadY = 30;
                // Floating Crystals
                const crystalGeo = new THREE.IcosahedronGeometry(1, 0);
                const crystalMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    metalness: 0.1,
                    roughness: 0.2,
                    transparent: true,
                    opacity: 0.75,
                    premultipliedAlpha: true
                });

                for (let i = 0; i < 25; i++) {
                    const mesh = new THREE.Mesh(crystalGeo, crystalMat);

                    mesh.position.set(
                        (Math.random() - 0.5) * spreadX,
                        (Math.random() - 0.5) * spreadY,
                        (Math.random() - 0.5) * 25
                    );

                    const scale = 0.5 + Math.random() * 1.5;
                    mesh.scale.set(scale, scale, scale);

                    mesh.userData = {
                        isCrystal: true,
                        rotX: (Math.random() - 0.5) * 0.005,
                        rotY: (Math.random() - 0.5) * 0.005,
                        floatSpeed: 0.1 + Math.random() * 0.2,
                        floatOffset: Math.random() * Math.PI * 2
                    };

                    scene.add(mesh);
                    themeObjects.push(mesh);
                }
            } else if (theme === 'maze') {
                camera.position.set(0, 0, 0);

                // --- Start of Maze Refactoring ---

                const mazeConfig = {
                    size: 20,      // 迷路のサイズ (S x S)
                    cellSize: 5,   // 各セルのサイズ
                    wallHeight: 3, // 壁の高さ
                    wallThick: 0.5 // 壁の厚み
                };
                
                const wallMaterial = new THREE.MeshPhongMaterial({
                    color: 0xa5f3fc, // 明るいパステルシアン (Tailwind cyan-200)
                    emissive: 0x0891b2, // 少し濃いシアンで陰影をサポート
                    emissiveIntensity: 0.1, // 白飛び対策で強度を下げる
                    transparent: true,
                    opacity: 0.95,
                    shininess: 40,
                    specular: 0xffffff
                });
                const floorMat = new THREE.MeshPhongMaterial({
                    color: 0xfbcfe8, // 明るいパステルピンク (Tailwind pink-200)
                    emissive: 0xdb2777,
                    emissiveIntensity: 0.05, // 同様に下げる
                    shininess: 20
                });
                const ceilingMat = new THREE.MeshPhongMaterial({
                    color: 0xfef08a, // 明るいパステルイエロー (Tailwind yellow-200)
                    emissive: 0xca8a04,
                    emissiveIntensity: 0.05, // 同様に下げる
                    transparent: true,
                    opacity: 0.8,
                    shininess: 20
                });

                // 迷路データを生成
                const maze = generateMaze(mazeConfig.size, mazeConfig.size);

                const mazeGroup = new THREE.Group();
                // userDataにマテリアルを格納
                mazeGroup.userData.materials = { wall: wallMaterial, floor: floorMat, ceiling: ceilingMat };
                const totalSize = mazeConfig.size * mazeConfig.cellSize;
                const offset = -totalSize / 2 + mazeConfig.cellSize / 2;

                // 壁と床を生成
                for (let y = 0; y < mazeConfig.size; y++) {
                    for (let x = 0; x < mazeConfig.size; x++) {
                        const cell = maze[y][x];
                        const worldX = x * mazeConfig.cellSize + offset;
                        const worldZ = y * mazeConfig.cellSize + offset;

                        // 上の壁
                        if (cell.up) {
                            const wallGeo = new THREE.BoxGeometry(mazeConfig.cellSize + mazeConfig.wallThick, mazeConfig.wallHeight, mazeConfig.wallThick);
                            const wall = new THREE.Mesh(wallGeo, wallMaterial);
                            wall.position.set(worldX, 0, worldZ - mazeConfig.cellSize / 2);
                            mazeGroup.add(wall);
                        }
                        // 左の壁
                        if (cell.left) {
                            const wallGeo = new THREE.BoxGeometry(mazeConfig.wallThick, mazeConfig.wallHeight, mazeConfig.cellSize + mazeConfig.wallThick);
                            const wall = new THREE.Mesh(wallGeo, wallMaterial);
                            wall.position.set(worldX - mazeConfig.cellSize / 2, 0, worldZ);
                            mazeGroup.add(wall);
                        }
                    }
                }
                
                // 床
                const floorGeo = new THREE.PlaneGeometry(totalSize, totalSize);
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -mazeConfig.wallHeight / 2;
                mazeGroup.add(floor);
                
                // 天井
                const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
                ceiling.rotation.x = Math.PI / 2;
                ceiling.position.y = mazeConfig.wallHeight / 2;
                mazeGroup.add(ceiling);

                scene.add(mazeGroup);
                themeObjects.push(mazeGroup);

                // カメラの迷路探索用データを初期化
                camera.userData.maze = {
                    config: mazeConfig,
                    maze: maze,
                    currentCell: { x: 0, y: 0 },
                    targetCell: { x: 0, y: 0 },
                    direction: new THREE.Vector3(1, 0, 0), // 初期方向(東)
                    moveProgress: 1, 
                    moveSpeed: 0.03,
                    // --- Rotation properties ---
                    isRotating: false,
                    rotationProgress: 1,
                    rotationSpeed: 0.08, // 回転速度
                    startQuaternion: new THREE.Quaternion(),
                    targetQuaternion: new THREE.Quaternion(),
                };
                
                const startX = 0 * mazeConfig.cellSize + offset;
                const startZ = 0 * mazeConfig.cellSize + offset;
                camera.position.set(startX, 0, startZ);
                
                // Set initial rotation to look East
                camera.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), new THREE.Vector3(1, 0, 0));
                
                // --- End of Maze Refactoring ---
            }
        }

        function vectorToWall(v) {
            if (v.z > 0.5) return 'down';
            if (v.z < -0.5) return 'up';
            if (v.x > 0.5) return 'right';
            if (v.x < -0.5) return 'left';
            return null;
        }

        function animate(time) {
            animFrameId = requestAnimationFrame(animate);
            const t = time ? time * 0.001 : 0;

            if (currentTheme === 'neon') {
                const gridSize = 200;
                themeObjects.forEach(obj => {
                    if (obj.userData.isWireframeObject) {
                        const { rotX, rotY, floatSpeed, floatOffset } = obj.userData;
                        obj.rotation.x += rotX;
                        obj.rotation.y += rotY;
                        obj.position.y += Math.sin(t * 0.5 + floatOffset) * floatSpeed;
                    }
                    if (obj.userData.isFlowingGrid) {
                        obj.position.z += obj.userData.speed;
                        if (obj.position.z > gridSize / 2) {
                            obj.position.z -= gridSize;
                        }
                    }
                });
            } else if (currentTheme === 'biz') {
                const particlesObject = themeObjects.find(obj => obj.userData.isParticleNetwork);
                const linesObject = themeObjects.find(obj => obj.type === 'LineSegments');

                if (particlesObject && linesObject) {
                    const particles = particlesObject.geometry.attributes.position;
                    const velocities = particlesObject.geometry.userData.velocities;
                    const particleCount = particles.count;
                    const positions = particles.array;
                    
                    const linePositions = [];
                    const connectionDistance = 5;

                    for (let i = 0; i < particleCount; i++) {
                        positions[i * 3] += velocities[i].x * 0.1;
                        positions[i * 3 + 1] += velocities[i].y * 0.1;
                        positions[i * 3 + 2] += velocities[i].z * 0.1;

                        // Wrap particles around
                        if (Math.abs(positions[i * 3]) > 25) velocities[i].x *= -1;
                        if (Math.abs(positions[i * 3 + 1]) > 15) velocities[i].y *= -1;
                        if (Math.abs(positions[i * 3 + 2]) > 15) velocities[i].z *= -1;
                        
                        // Check for connections
                        for (let j = i + 1; j < particleCount; j++) {
                            const dx = positions[i * 3] - positions[j * 3];
                            const dy = positions[i * 3 + 1] - positions[j * 3 + 1];
                            const dz = positions[i * 3 + 2] - positions[j * 3 + 2];
                            const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                            if (distance < connectionDistance) {
                                linePositions.push(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
                                linePositions.push(positions[j * 3], positions[j * 3 + 1], positions[j * 3 + 2]);
                            }
                        }
                    }
                    
                    particles.needsUpdate = true;

                    linesObject.geometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
                    linesObject.geometry.attributes.position.needsUpdate = true;
                }
            } else if (currentTheme === 'slate') {
                themeObjects.forEach(obj => {
                    if (obj.userData.isCrystal) {
                        const { rotX, rotY, floatSpeed, floatOffset } = obj.userData;
                        obj.rotation.x += rotX;
                        obj.rotation.y += rotY;
                        obj.position.y += Math.sin(t * floatSpeed + floatOffset) * 0.02;
                    }
                });
            } else if (currentTheme === 'maze' && camera.userData.maze) {
                // --- 壁の色を時間で変化させる ---
                const mazeGroup = themeObjects.find(obj => obj.userData.materials);
                if (mazeGroup) {
                    const hue = (t * 0.01) % 1; // 時間で色相を変化させる (速度調整)
                    const materials = mazeGroup.userData.materials;
                    
                    // HSLで色を更新 (彩度・輝度はテーマに合わせて調整)
                    materials.wall.color.setHSL(hue, 0.7, 0.8);
                    materials.floor.color.setHSL((hue + 0.33) % 1, 0.6, 0.75);
                    materials.ceiling.color.setHSL((hue + 0.66) % 1, 0.7, 0.85);
                    
                    // 発光色も色相を追従させる (輝度は少し下げる)
                    materials.wall.emissive.setHSL(hue, 0.7, 0.4);
                    materials.floor.emissive.setHSL((hue + 0.33) % 1, 0.6, 0.35);
                    materials.ceiling.emissive.setHSL((hue + 0.66) % 1, 0.7, 0.4);
                }

                // --- Start of Maze Animation Refactoring ---
                const mazeData = camera.userData.maze;
                const { config, maze } = mazeData;
                
                if (pointLight) {
                    pointLight.position.copy(camera.position);
                    pointLight.position.y = 0.5;
                }

                if (mazeData.isRotating) {
                    // 回転中
                    mazeData.rotationProgress = Math.min(1, mazeData.rotationProgress + mazeData.rotationSpeed);
                    THREE.Quaternion.slerp(mazeData.startQuaternion, mazeData.targetQuaternion, camera.quaternion, mazeData.rotationProgress);

                    if (mazeData.rotationProgress === 1) {
                        mazeData.isRotating = false;
                        mazeData.moveProgress = 0; // 回転完了後、移動開始
                    }
                }
                else if (mazeData.moveProgress < 1) {
                    // 移動中
                    mazeData.moveProgress = Math.min(1, mazeData.moveProgress + mazeData.moveSpeed);
                    
                    const offset = -config.size * config.cellSize / 2 + config.cellSize / 2;
                    const startX = mazeData.currentCell.x * config.cellSize + offset;
                    const startZ = mazeData.currentCell.y * config.cellSize + offset;
                    const targetX = mazeData.targetCell.x * config.cellSize + offset;
                    const targetZ = mazeData.targetCell.y * config.cellSize + offset;

                    camera.position.x = THREE.MathUtils.lerp(startX, targetX, mazeData.moveProgress);
                    camera.position.z = THREE.MathUtils.lerp(startZ, targetZ, mazeData.moveProgress);

                } else {
                    // 移動完了、次のセルを決定
                    mazeData.currentCell = { ...mazeData.targetCell };
                    const { x, y } = mazeData.currentCell;
                    const cell = maze[y][x];

                    // --- New Randomized Algorithm ---
                    const forwardVec = mazeData.direction;
                    const leftVec = new THREE.Vector3(forwardVec.z, 0, -forwardVec.x);
                    const rightVec = new THREE.Vector3(-forwardVec.z, 0, forwardVec.x);
                    const backVec = forwardVec.clone().multiplyScalar(-1);

                    const forwardWall = vectorToWall(forwardVec);
                    const canGoForward = forwardWall && !cell[forwardWall];

                    let choice = null;

                    // 基本的に直進を優先するが、時々ランダムに曲がる
                    if (canGoForward && Math.random() > 0.2) { 
                        choice = { dir: forwardVec, next: { x: x + forwardVec.x, y: y + forwardVec.z } };
                    } else {
                        // 前方が壁、または20%の確率で、他の選択肢を検討
                        const leftWall = vectorToWall(leftVec);
                        const rightWall = vectorToWall(rightVec);
                        
                        const possibleTurns = [];
                        if (leftWall && !cell[leftWall]) {
                            possibleTurns.push({ dir: leftVec, next: { x: x + leftVec.x, y: y + leftVec.z } });
                        }
                        if (rightWall && !cell[rightWall]) {
                            possibleTurns.push({ dir: rightVec, next: { x: x + rightVec.x, y: y + rightVec.z } });
                        }
                        if (canGoForward) { // 直進も選択肢に含める
                             possibleTurns.push({ dir: forwardVec, next: { x: x + forwardVec.x, y: y + forwardVec.z } });
                        }

                        if (possibleTurns.length > 0) {
                            // 可能な方向からランダムに選択
                            choice = possibleTurns[Math.floor(Math.random() * possibleTurns.length)];
                        } else {
                            // 行き止まりの場合は後退
                            choice = { dir: backVec, next: { x: x + backVec.x, y: y + backVec.z } };
                        }
                    }

                    if (!choice) { // Fallback
                        choice = { dir: backVec, next: { x: x + backVec.x, y: y + backVec.z } };
                    }
                    // --- End of Algorithm ---

                    mazeData.targetCell = choice.next;
                    
                    const debugDiv = document.getElementById('debugInfo');
                    if (debugDiv) {
                        const q = camera.quaternion;
                        const roundVec = v => `{x:${v.x.toFixed(0)}, z:${v.z.toFixed(0)}}`;
                        debugDiv.innerHTML = `
                            Direction: ${roundVec(mazeData.direction)}<br>
                            Choice Dir: ${roundVec(choice.dir)}<br>
                            Current Cell: {x:${mazeData.currentCell.x}, y:${mazeData.currentCell.y}}<br>
                            Target Cell: {x:${mazeData.targetCell.x}, y:${mazeData.targetCell.y}}<br>
                            Quaternion: {x:${q.x.toFixed(2)}, y:${q.y.toFixed(2)}, z:${q.z.toFixed(2)}, w:${q.w.toFixed(2)}}
                        `;
                    }

                    if (!mazeData.direction.equals(choice.dir)) {
                        mazeData.direction.copy(choice.dir);
                        mazeData.isRotating = true;
                        mazeData.rotationProgress = 0;
                        mazeData.startQuaternion.copy(camera.quaternion);
                        mazeData.targetQuaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), choice.dir.clone().normalize());
                    } else {
                        mazeData.moveProgress = 0;
                    }
                }
                renderer.render(scene, camera);
                return;
                // --- End of Maze Animation Refactoring ---
            } else {
                // Default animation for 'pop' theme
                themeObjects.forEach(obj => {
                    if (obj.userData) {
                        if (obj.userData.speedY) {
                            obj.position.y += Math.sin(t + obj.userData.floatOffset) * 0.01;
                        }
                        if (obj.userData.rotX) obj.rotation.x += obj.userData.rotX;
                        if (obj.userData.rotY) obj.rotation.y += obj.userData.rotY;
                        if (obj.userData.rotZ) obj.rotation.z += obj.userData.rotZ;
                    }
                });
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function stopSound() {
            isAudioPlaying = false;
            if (activeAudioInterval) {
                clearInterval(activeAudioInterval);
                activeAudioInterval = null;
            }
            const icon = document.getElementById('audioIcon');
            if (icon) icon.className = 'fa-solid fa-volume-xmark text-lg';
        }

        function playSound() {
            stopSound();
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isAudioPlaying = true;
            const icon = document.getElementById('audioIcon');
            if (icon) icon.className = 'fa-solid fa-volume-high text-lg text-emerald-500 animate-pulse';

            if (currentSoundType === 'pop') {
                playPopMelody();
            } else if (currentSoundType === 'chirp') {
                playChirpAmbience();
            } else if (currentSoundType === 'lofi') {
                playDeepAmbient();
            }
        }

        function playPopMelody() {
            const notes = [523.25, 587.33, 659.25, 783.99, 880.00];
            let step = 0;

            activeAudioInterval = setInterval(() => {
                if (!isAudioPlaying || !audioCtx) return;
                const freq = notes[step % notes.length];
                step++;

                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.42);
                } catch(e) {}
            }, 500);
        }

        function playChirpAmbience() {
            activeAudioInterval = setInterval(() => {
                if (!isAudioPlaying || !audioCtx) return;
                if (Math.random() > 0.5) {
                    try {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const startFreq = 2200 + Math.random() * 800;

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(startFreq + 500, audioCtx.currentTime + 0.1);

                        gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.13);
                    } catch(e) {}
                }
            }, 700);
        }

        function playDeepAmbient() {
            const chord = [130.81, 164.81, 196.00, 246.94];
            let idx = 0;

            activeAudioInterval = setInterval(() => {
                if (!isAudioPlaying || !audioCtx) return;
                const freq = chord[idx % chord.length];
                idx++;

                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.25);
                } catch(e) {}
            }, 1200);
        }

        function generateMaze(width, height) {
            const maze = Array(height).fill(null).map((_, y) => Array(width).fill(null).map((_, x) => ({
                up: true, down: true, left: true, right: true, visited: false, x, y
            })));

            function carve(cx, cy) {
                const cell = maze[cy][cx];
                cell.visited = true;

                const directions = [{x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0}];
                directions.sort(() => Math.random() - 0.5);

                for (const { x: dx, y: dy } of directions) {
                    const nx = cx + dx;
                    const ny = cy + dy;

                    if (nx >= 0 && ny >= 0 && nx < width && ny < height && !maze[ny][nx].visited) {
                        if (dx === 1) { // Move right
                            cell.right = false;
                            maze[ny][nx].left = false;
                        } else if (dx === -1) { // Move left
                            cell.left = false;
                            maze[ny][nx].right = false;
                        } else if (dy === 1) { // Move down
                            cell.down = false;
                            maze[ny][nx].up = false;
                        } else if (dy === -1) { // Move up
                            cell.up = false;
                            maze[ny][nx].down = false;
                        }
                        carve(nx, ny);
                    }
                }
            }

            carve(0, 0);
            return maze;
        }

        window.applyTheme = function(themeKey) {
            currentTheme = themeKey;

            // Update body class cleanly
            document.body.classList.remove('theme-pop', 'theme-neon', 'theme-biz', 'theme-slate', 'theme-maze');
            document.body.classList.add(`theme-${themeKey}`);

            // Synchronize 3D point light
            if (pointLight) {
                const lightColors = {
                    'pop': 0xff70a6,
                    'neon': 0x00f5d4,
                    'biz': 0x38bdf8,
                    'slate': 0x94a3b8,
                    'maze': 0x0ea5e9
                };
                pointLight.color.setHex(lightColors[themeKey] || 0xff70a6);

                if (themeKey === 'maze') {
                    pointLight.intensity = 4;
                    pointLight.distance = 25;
                } else {
                    pointLight.intensity = 2;
                    pointLight.distance = 50;
                }
            }

            const labelMap = {
                'pop': 'ポップ＆パステル 🍬',
                'neon': 'ネオン＆サイバー ⚡',
                'biz': 'ビジネス＆コーポレート 💼',
                'slate': 'ミニマル＆シック 🏛️',
                'maze': '迷路 🗺️'
            };

            const dropdownLabelMap = {
                'pop': 'ポップ＆パステル',
                'neon': 'ネオン＆サイバー',
                'biz': 'ビジネス＆コーポレート',
                'slate': 'ミニマル＆シック',
                'maze': '迷路スクリーンセーバー'
            };

            const currentThemeLabel = document.getElementById('currentThemeLabel');
            if (currentThemeLabel) currentThemeLabel.innerText = dropdownLabelMap[themeKey] || 'ポップ＆パステル';

            const bgThemeName = document.getElementById('bgThemeName');
            if (bgThemeName) bgThemeName.innerText = `背景: ${labelMap[themeKey] || 'ポップ＆パステル'}`;

            // Highlight active menu item
            document.querySelectorAll('.theme-select-option').forEach(opt => {
                if (opt.getAttribute('data-theme') === themeKey) {
                    opt.classList.add('bg-black/10', 'dark:bg-white/20');
                } else {
                    opt.classList.remove('bg-black/10', 'dark:bg-white/20');
                }
            });

            createThemeObjects(themeKey);

            if (themeKey === 'maze' && camera) {
                // When switching to maze theme, ensure camera user data is re-initialized by createThemeObjects
                // The re-initialization logic is now inside createThemeObjects for maze theme
            }
        };

        function updateFullscreenIcon() {
            const doc = document;
            const fsElement = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;
            const isPseudo = document.body.classList.contains('is-pseudo-fullscreen');
            const fsBtnIcon = document.querySelector('#fullscreenBtn i');

            if (fsBtnIcon) {
                if (fsElement || isPseudo) {
                    fsBtnIcon.className = 'fa-solid fa-compress text-lg';
                } else {
                    fsBtnIcon.className = 'fa-solid fa-expand text-lg';
                }
            }
        }

        function toggleFullscreen() {
            const doc = document;
            const docEl = document.documentElement;

            const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
            const exitFS = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
            const fsElement = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;

            if (!fsElement && !document.body.classList.contains('is-pseudo-fullscreen')) {
                if (requestFS) {
                    try {
                        const promise = requestFS.call(docEl);
                        if (promise && promise.then) {
                            promise.catch(() => {
                                togglePseudoFullscreen();
                            });
                        }
                    } catch (e) {
                        togglePseudoFullscreen();
                    }
                } else {
                    togglePseudoFullscreen();
                }
            } else {
                if (document.body.classList.contains('is-pseudo-fullscreen')) {
                    togglePseudoFullscreen();
                } else if (exitFS) {
                    try {
                        const promise = exitFS.call(doc);
                        if (promise && promise.then) {
                            promise.catch(() => {
                                togglePseudoFullscreen();
                            });
                        }
                    } catch (e) {
                        togglePseudoFullscreen();
                    }
                } else {
                    togglePseudoFullscreen();
                }
            }
        }

        function togglePseudoFullscreen() {
            document.body.classList.toggle('is-pseudo-fullscreen');
            updateFullscreenIcon();
        }

        function initApp() {
            setTargetTime(targetHour, targetMinute);
            initThreeJS();
            animate();

            // Start timer updates
            setInterval(updateClock, 1000);
            updateClock();

            // Handle Screen Resize
            window.addEventListener('resize', () => {
                if (camera && renderer) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });

            // Mouse move tracking for interactive elements
            window.addEventListener('mousemove', (event) => {
                mousePos.x = (event.clientX / window.innerWidth) * 2 - 1;
                mousePos.y = - (event.clientY / window.innerHeight) * 2 + 1;
            }, { passive: true });

            // Theme Dropdown Toggle & Event Delegation
            const themeBtn = document.getElementById('themeDropdownBtn');
            const themeMenu = document.getElementById('themeMenu');

            if (themeBtn && themeMenu) {
                themeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    themeMenu.classList.toggle('hidden');
                });

                // Robust event delegation for theme menu clicks
                themeMenu.addEventListener('click', (e) => {
                    const option = e.target.closest('.theme-select-option');
                    if (option) {
                        e.stopPropagation();
                        e.preventDefault();
                        const themeKey = option.getAttribute('data-theme');
                        if (themeKey) {
                            window.applyTheme(themeKey);
                        }
                        themeMenu.classList.add('hidden');
                    }
                });

                document.addEventListener('click', (e) => {
                    if (!themeMenu.contains(e.target) && !themeBtn.contains(e.target)) {
                        themeMenu.classList.add('hidden');
                    }
                });
            }

            // Audio Controls
            const audioBtn = document.getElementById('audioBtn');
            if (audioBtn) {
                audioBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (isAudioPlaying) {
                        stopSound();
                    } else {
                        playSound();
                    }
                });
            }

            // Modal Controls
            const modal = document.getElementById('settingsModal');
            const container = document.getElementById('modalContainer');

            function openModal() {
                if (!modal || !container) return;
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    container.classList.remove('scale-95');
                    container.classList.add('scale-100');
                }, 10);
            }

            function closeModal() {
                if (!modal || !container) return;
                modal.classList.add('opacity-0');
                container.classList.remove('scale-100');
                container.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }

            const settingsBtn = document.getElementById('settingsBtn');
            if (settingsBtn) settingsBtn.addEventListener('click', openModal);

            const closeSettingsBtn = document.getElementById('closeSettingsBtn');
            if (closeSettingsBtn) closeSettingsBtn.addEventListener('click', closeModal);

            const saveSettingsClose = document.getElementById('saveSettingsClose');
            if (saveSettingsClose) saveSettingsClose.addEventListener('click', closeModal);

            // Time Input Change Event
            const timeInput = document.getElementById('timeInput');
            if (timeInput) {
                timeInput.addEventListener('input', (e) => {
                    const val = e.target.value;
                    if (val) {
                        const [h, m] = val.split(':').map(Number);
                        setTargetTime(h, m);
                    }
                });
            }

            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const target = e.currentTarget;
                    const timeVal = target.getAttribute('data-time');
                    const addVal = target.getAttribute('data-add');

                    if (timeVal) {
                        const [h, m] = timeVal.split(':').map(Number);
                        setTargetTime(h, m);
                    } else if (addVal) {
                        const now = new Date();
                        const future = new Date(now.getTime() + parseInt(addVal, 10) * 60000);
                        setTargetTime(future.getHours(), future.getMinutes());
                    }
                });
            });

            // Text Inputs
            const mainMsgInput = document.getElementById('mainMsgInput');
            if (mainMsgInput) {
                mainMsgInput.addEventListener('input', (e) => {
                    document.getElementById('mainMessage').innerText = e.target.value;
                });
            }

            const subMsgInput = document.getElementById('subMsgInput');
            if (subMsgInput) {
                subMsgInput.addEventListener('input', (e) => {
                    document.getElementById('subMessageText').innerText = e.target.value;
                });
            }

            // Sound Type Selector
            const soundBtns = document.querySelectorAll('.sound-type-btn');
            soundBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    soundBtns.forEach(b => {
                        b.className = 'sound-type-btn pop-btn py-2 rounded-xl text-xs font-bold opacity-70 cursor-pointer';
                    });
                    e.currentTarget.className = 'sound-type-btn pop-btn py-2 rounded-xl text-xs font-bold border-2 border-pink-400 cursor-pointer';

                    if (e.currentTarget.id === 'bgmTypePop') currentSoundType = 'pop';
                    if (e.currentTarget.id === 'bgmTypeChirp') currentSoundType = 'chirp';
                    if (e.currentTarget.id === 'bgmTypeLofi') currentSoundType = 'lofi';

                    if (isAudioPlaying) playSound();
                });
            });

            // Fullscreen Toggle
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    toggleFullscreen();
                });
            }

            // Synchronize fullscreen icon on browser-level fullscreen change
            document.addEventListener('fullscreenchange', updateFullscreenIcon);
            document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);
            document.addEventListener('mozfullscreenchange', updateFullscreenIcon);
            document.addEventListener('MSFullscreenChange', updateFullscreenIcon);
        }

        // Safe script execution
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
    <div id="debugInfo" class="fixed bottom-0 left-0 bg-black/50 text-white text-xs p-2 font-mono z-50" style="pointer-events: none;"></div>
