    <script>
        // Global State Variables
        const initialTarget = new Date(Date.now() + 10 * 60 * 1000);
        let targetHour = initialTarget.getHours();
        let targetMinute = initialTarget.getMinutes();
        let currentTheme = 'slate';

        let scene, camera, renderer, pointLight;
        let themeObjects = [];
        let animFrameId = null;

        let audioCtx = null;
        let isAudioPlaying = false;
        let currentSoundType = 'pop';
        let activeAudioInterval = null;
        let showDebugInfo = false; // 迷路のデバッグ情報を表示するかどうか

        let minimapCanvas, minimapCtx;

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g,
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        function updateMainMessage(text) {
            const mainMessage = document.getElementById('mainMessage');
            if (!mainMessage) return;

            // 「〜から」「〜より」「〜まで」などの区切りパターン
            const match = text.match(/^(.*(?:から|より|まで))(.*)$/);
            if (match && match[1] && match[2]) {
                mainMessage.innerHTML = `<span class="inline-block">${escapeHTML(match[1])}</span><span class="inline-block">${escapeHTML(match[2])}</span>`;
            } else {
                // スペース区切りの場合
                const words = text.split(/\s+/).filter(Boolean);
                if (words.length > 1) {
                    mainMessage.innerHTML = words.map(w => `<span class="inline-block">${escapeHTML(w)}</span>`).join(' ');
                } else {
                    mainMessage.innerText = text;
                }
            }
        }

        function updateClock() {
            const now = new Date();
            
            // Format current time display
            const ch = String(now.getHours()).padStart(2, '0');
            const cm = String(now.getMinutes()).padStart(2, '0');
            const cs = String(now.getSeconds()).padStart(2, '0');
            const timeElem = document.getElementById('currentTimeDisplay');
            if (timeElem) timeElem.innerText = `${ch}:${cm}:${cs}`;

            // Target time calculation
            const target = new Date();
            target.setHours(targetHour, targetMinute, 0, 0);

            let diff = target.getTime() - now.getTime();
            const countElem = document.getElementById('countdownDisplay');
            if (!countElem) return;

            if (diff <= 0) {
                countElem.innerText = "00:00";
            } else {
                const totalSec = Math.floor(diff / 1000);
                const hours = Math.floor(totalSec / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;

                if (hours > 0) {
                    countElem.innerText = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
                } else {
                    countElem.innerText = `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
                }
            }
        }

        function setTargetTime(h, m) {
            targetHour = parseInt(h, 10);
            targetMinute = parseInt(m, 10);
            
            const hStr = String(targetHour).padStart(2, '0');
            const mStr = String(targetMinute).padStart(2, '0');
            const timeStr = `${hStr}:${mStr}`;

            const timeInput = document.getElementById('timeInput');
            if (timeInput) {
                timeInput.value = timeStr;
            }

            const mainMessageText = `${timeStr}から再開します。`;

            updateMainMessage(mainMessageText);

            const mainMsgInput = document.getElementById('mainMsgInput');
            if (mainMsgInput) {
                mainMsgInput.value = mainMessageText;
            }

            document.title = `${timeStr}から再開します - 休憩中スクリーン`;

            updateClock();
        }

        function initThreeJS() {
            const canvas = document.getElementById('bgCanvas');
            if (!canvas) return;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            //シーンにフォグを追加
            scene.fog = new THREE.Fog(0xe0f2fe, 1, 40);

            // Ambient & Directional Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            pointLight = new THREE.PointLight(0x94a3b8, 2, 50);
            pointLight.position.set(-10, -10, 10);
            scene.add(pointLight);
        }

        function clearThemeObjects() {
            themeObjects.forEach(obj => {
                scene.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) {
                        obj.material.forEach(m => m.dispose());
                    } else {
                        obj.material.dispose();
                    }
                }
            });
            themeObjects = [];
        }

        let mousePos = new THREE.Vector2();

        function createThemeObjects(theme) {
            if (!scene) return;
            clearThemeObjects();
            camera.position.z = 30; // Reset camera position for all themes
            const aspectRatio = window.innerWidth / window.innerHeight;

            if (theme === 'pop') {
                const colors = [0xff70a6, 0xff9f1c, 0xffd166, 0x06d6a0, 0x118ab2, 0xa2d2ff];
                const sphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
                const torusGeo = new THREE.TorusGeometry(1.5, 0.5, 16, 32);
                const spreadX = 35 * aspectRatio;
                const spreadY = 35;

                for (let i = 0; i < 35; i++) {
                    const color = colors[i % colors.length];
                    const mat = new THREE.MeshPhongMaterial({
                        color: color,
                        shininess: 90,
                        specular: 0xffffff,
                        transparent: true,
                        opacity: 0.85
                    });

                    const useTorus = (i % 4 === 0);
                    const mesh = new THREE.Mesh(useTorus ? torusGeo : sphereGeo, mat);

                    mesh.position.set(
                        (Math.random() - 0.5) * spreadX,
                        (Math.random() - 0.5) * spreadY,
                        (Math.random() - 0.5) * 30
                    );

                    const scale = 0.6 + Math.random() * 1.2;
                    mesh.scale.set(scale, scale, scale);

                    mesh.userData = {
                        speedY: 0.005 + Math.random() * 0.012,
                        rotX: (Math.random() - 0.5) * 0.02,
                        rotY: (Math.random() - 0.5) * 0.02,
                        initialY: mesh.position.y,
                        floatOffset: Math.random() * Math.PI * 2
                    };

                    scene.add(mesh);
                    themeObjects.push(mesh);
                }
            } else if (theme === 'neon') {
                camera.position.z = 40; // カメラを少し引く
                const spreadX = 30 * aspectRatio;
                const spreadY = 30;

                // 浮遊するワイヤーフレームオブジェクト
                const geoTypes = [
                    new THREE.TorusGeometry(8, 1, 16, 32),
                    new THREE.IcosahedronGeometry(6, 0),
                    new THREE.TorusKnotGeometry(6, 0.8, 100, 8),
                ];
                const colors = [0x42a5f5, 0xd436f7, 0x00f5d4];

                for(let i=0; i<8; i++) {
                    const mat = new THREE.MeshBasicMaterial({
                        color: colors[i % colors.length],
                        wireframe: true,
                        transparent: true,
                        opacity: 0.15 + Math.random() * 0.15
                    });
                    const mesh = new THREE.Mesh(geoTypes[i % geoTypes.length], mat);

                    mesh.position.set(
                        (Math.random() - 0.5) * spreadX,
                        (Math.random() - 0.5) * spreadY,
                        (Math.random() - 0.5) * 20 - 30
                    );

                    const scale = 0.3 + Math.random() * 0.5;
                    mesh.scale.set(scale, scale, scale);

                    mesh.userData = {
                        isWireframeObject: true,
                        rotX: (Math.random() - 0.5) * 0.005,
                        rotY: (Math.random() - 0.5) * 0.005,
                        floatSpeed: 0.01 + Math.random() * 0.02,
                        floatOffset: Math.random() * Math.PI * 2
                    };
                    scene.add(mesh);
                    themeObjects.push(mesh);
                }

                // 流れるグリッド
                const gridSize = 200;
                const gridDivisions = 60;

                const gridMat = new THREE.ShaderMaterial({
                    uniforms: {
                        color: { value: new THREE.Color(0xd436f7) },
                        fadeDistance: { value: 50.0 }
                    },
                    vertexShader: `
                        varying float vDistance;
                        void main() {
                            vDistance = abs(position.z);
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 color;
                        uniform float fadeDistance;
                        varying float vDistance;
                        void main() {
                            float opacity = 1.0 - smoothstep(0.0, fadeDistance, vDistance);
                            gl_FragColor = vec4(color, opacity * 0.2);
                        }
                    `,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });

                const gridHelper1 = new THREE.GridHelper(gridSize, gridDivisions, 0xffffff, 0xffffff);
                gridHelper1.material = gridMat.clone();
                gridHelper1.position.y = -20;
                gridHelper1.userData = { isFlowingGrid: true, speed: 0.2 };
                scene.add(gridHelper1);
                themeObjects.push(gridHelper1);

                const gridHelper2 = new THREE.GridHelper(gridSize, gridDivisions, 0xffffff, 0xffffff);
                gridHelper2.material = gridMat.clone();
                gridHelper2.material.uniforms.color.value = new THREE.Color(0x42a5f5);
                gridHelper2.position.y = -20;
                gridHelper2.position.z = gridSize / 2;
                gridHelper2.userData = { isFlowingGrid: true, speed: 0.2 };
                scene.add(gridHelper2);
                themeObjects.push(gridHelper2);

            } else if (theme === 'biz') {
                const spreadX = 30 * aspectRatio;
                const spreadY = 30;
                // Particle Network
                const particleCount = 120;
                const particlesGeo = new THREE.BufferGeometry();
                const posArray = new Float32Array(particleCount * 3);
                const velocities = [];

                for (let i = 0; i < particleCount; i++) {
                    posArray[i * 3] = (Math.random() - 0.5) * spreadX;
                    posArray[i * 3 + 1] = (Math.random() - 0.5) * spreadY;
                    posArray[i * 3 + 2] = (Math.random() - 0.5) * 30;
                    
                    velocities.push({
                        x: (Math.random() - 0.5) * 0.1,
                        y: (Math.random() - 0.5) * 0.1,
                        z: (Math.random() - 0.5) * 0.1
                    });
                }
                particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
                particlesGeo.userData.velocities = velocities;

                const pMat = new THREE.PointsMaterial({
                    color: 0x818cf8,
                    size: 0.15,
                    transparent: true,
                    opacity: 0.8
                });
                
                const particles = new THREE.Points(particlesGeo, pMat);
                particles.userData.isParticleNetwork = true;
                scene.add(particles);
                themeObjects.push(particles);

                // Lines geometry
                const lineGeo = new THREE.BufferGeometry();
                const lineMat = new THREE.LineBasicMaterial({
                    color: 0x818cf8,
                    transparent: true,
                    opacity: 0.2
                });
                const lines = new THREE.LineSegments(lineGeo, lineMat);
                scene.add(lines);
                themeObjects.push(lines);

                // Add a soft floor grid
                const gridHelper = new THREE.GridHelper(80, 40, 0x818cf8, 0x818cf8);
                gridHelper.position.y = -18;
                gridHelper.material.opacity = 0.1;
                gridHelper.material.transparent = true;
                scene.add(gridHelper);
                themeObjects.push(gridHelper);

            } else if (theme === 'slate') {
                const spreadX = 30 * aspectRatio;
                const spreadY = 30;
                // Floating Crystals
                const crystalGeo = new THREE.IcosahedronGeometry(1, 0);
                const crystalMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    metalness: 0.1,
                    roughness: 0.2,
                    transparent: true,
                    opacity: 0.75,
                    premultipliedAlpha: true
                });

                for (let i = 0; i < 25; i++) {
                    const mesh = new THREE.Mesh(crystalGeo, crystalMat);

                    mesh.position.set(
                        (Math.random() - 0.5) * spreadX,
                        (Math.random() - 0.5) * spreadY,
                        (Math.random() - 0.5) * 25
                    );

                    const scale = 0.5 + Math.random() * 1.5;
                    mesh.scale.set(scale, scale, scale);

                    mesh.userData = {
                        isCrystal: true,
                        rotX: (Math.random() - 0.5) * 0.005,
                        rotY: (Math.random() - 0.5) * 0.005,
                        floatSpeed: 0.1 + Math.random() * 0.2,
                        floatOffset: Math.random() * Math.PI * 2
                    };

                    scene.add(mesh);
                    themeObjects.push(mesh);
                }
            } else if (theme === 'maze') {
                camera.position.set(0, 0, 0);

                // --- Start of Maze Refactoring ---

                const mazeConfig = {
                    size: 20,      // 迷路のサイズ (S x S)
                    cellSize: 5,   // 各セルのサイズ
                    wallHeight: 3, // 壁の高さ
                    wallThick: 0.5 // 壁の厚み
                };
                
                // 壁のシンプルな柄（にぎやかすぎない上品な格子・ドット模様）のテクスチャをCanvasで動的生成
                const wallTexture = (() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 128;
                    canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    
                    // 背景を不透明な白で塗りつぶす（これによりマテリアルのベース色が壁全体に乗り、壁の透過を防ぎます）
                    ctx.fillStyle = 'rgba(255, 255, 255, 1.0)';
                    ctx.fillRect(0, 0, 128, 128);
                    
                    // わずかに暗いシャドウ色（グレー）で細い格子を描画
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(0, 0, 128, 128);
                    
                    // クロスラインを描き、4つのサブタイルに分割して密度を調整
                    ctx.beginPath();
                    ctx.moveTo(64, 0); ctx.lineTo(64, 128);
                    ctx.moveTo(0, 64); ctx.lineTo(128, 64);
                    ctx.stroke();
                    
                    // 格子の交点に、にぎやかすぎない極小のアクセントドットを配する
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                    const dots = [0, 64, 128];
                    dots.forEach(x => {
                        dots.forEach(y => {
                            ctx.beginPath();
                            ctx.arc(x, y, 2.5, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    });

                    const texture = new THREE.CanvasTexture(canvas);
                    texture.wrapS = THREE.RepeatWrapping;
                    texture.wrapT = THREE.RepeatWrapping;
                    // 壁の主面の縦横比（cellSize=5, wallHeight=3）に合わせてタイリング
                    texture.repeat.set(5, 3);
                    return texture;
                })();
                
                const wallMaterial = new THREE.MeshLambertMaterial({
                    color: 0xa5f3fc, // 明るいパステルシアン (Tailwind cyan-200)
                    emissive: 0x0891b2, // 少し濃いシアンで陰影をサポート
                    emissiveIntensity: 0.1,
                    map: wallTexture // 生成したシンプルな柄をマッピング
                });
                const floorMat = new THREE.MeshStandardMaterial({
                    color: 0x1e293b, // 落ち着いたダークスレートブルー (白飛び防止)
                    roughness: 0.8,
                    metalness: 0.2
                });
                // 天井に貼る「明るい水色と白の実際の明るい空」のようなテクスチャをCanvasで生成
                const skyTexture = (() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1024;
                    canvas.height = 1024;
                    const ctx = canvas.getContext('2d');
                    
                    // グラデーション（明るい空色の青から、少し薄い水色へ）
                    const grad = ctx.createLinearGradient(0, 0, 0, 1024);
                    grad.addColorStop(0, '#0ea5e9');   // 明るい空色の青
                    grad.addColorStop(0.5, '#38bdf8'); // 明るい水色
                    grad.addColorStop(1, '#bae6fd');   // 白に近い水色
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, 1024, 1024);

                    // 雲を描画する関数
                    function drawCloud(cx, cy, scale) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                        ctx.shadowColor = 'rgba(14, 165, 233, 0.2)';
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.arc(cx, cy, 50 * scale, 0, Math.PI * 2);
                        ctx.arc(cx + 40 * scale, cy - 10 * scale, 60 * scale, 0, Math.PI * 2);
                        ctx.arc(cx + 90 * scale, cy, 50 * scale, 0, Math.PI * 2);
                        ctx.arc(cx + 40 * scale, cy + 20 * scale, 50 * scale, 0, Math.PI * 2);
                        ctx.closePath();
                        ctx.fill();
                        ctx.shadowBlur = 0; // リセット
                    }

                    // 迷路の天井に散りばめるように雲を配置
                    drawCloud(200, 300, 1.4);
                    drawCloud(750, 200, 1.2);
                    drawCloud(450, 750, 1.6);
                    drawCloud(800, 800, 1.0);
                    drawCloud(150, 850, 0.8);
                    drawCloud(500, 250, 1.1);

                    const texture = new THREE.CanvasTexture(canvas);
                    return texture;
                })();

                const ceilingMat = new THREE.MeshBasicMaterial({
                    map: skyTexture
                });

                // 迷路データを生成
                const maze = generateMaze(mazeConfig.size, mazeConfig.size);

                const mazeGroup = new THREE.Group();
                // userDataにマテリアルを格納
                mazeGroup.userData.materials = { wall: wallMaterial, floor: floorMat, ceiling: ceilingMat };
                const totalSize = mazeConfig.size * mazeConfig.cellSize;
                const offset = -totalSize / 2 + mazeConfig.cellSize / 2;

                // 壁と床を生成
                for (let y = 0; y < mazeConfig.size; y++) {
                    for (let x = 0; x < mazeConfig.size; x++) {
                        const cell = maze[y][x];
                        const worldX = x * mazeConfig.cellSize + offset;
                        const worldZ = y * mazeConfig.cellSize + offset;

                        // 上の壁
                        if (cell.up) {
                            const wallGeo = new THREE.BoxGeometry(mazeConfig.cellSize + mazeConfig.wallThick, mazeConfig.wallHeight, mazeConfig.wallThick);
                            const wall = new THREE.Mesh(wallGeo, wallMaterial);
                            wall.position.set(worldX, 0, worldZ - mazeConfig.cellSize / 2);
                            mazeGroup.add(wall);
                        }
                        // 左の壁
                        if (cell.left) {
                            const wallGeo = new THREE.BoxGeometry(mazeConfig.wallThick, mazeConfig.wallHeight, mazeConfig.cellSize + mazeConfig.wallThick);
                            const wall = new THREE.Mesh(wallGeo, wallMaterial);
                            wall.position.set(worldX - mazeConfig.cellSize / 2, 0, worldZ);
                            mazeGroup.add(wall);
                        }
                    }
                }
                
                // 床
                const floorGeo = new THREE.PlaneGeometry(totalSize, totalSize);
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -mazeConfig.wallHeight / 2;
                mazeGroup.add(floor);
                
                // 天井
                const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
                ceiling.rotation.x = Math.PI / 2;
                ceiling.position.y = mazeConfig.wallHeight / 2;
                mazeGroup.add(ceiling);

                // --- Goal Object & Light Setup ---
                const goalGroup = new THREE.Group();
                goalGroup.name = "goalGroup";
                
                const goalWorldX = (mazeConfig.size - 1) * mazeConfig.cellSize + offset;
                const goalWorldZ = (mazeConfig.size - 1) * mazeConfig.cellSize + offset;
                goalGroup.position.set(goalWorldX, 0, goalWorldZ);

                // 1. ゴールのシンボル (クリスタル・スターのような形状)
                const symbolGeo = new THREE.IcosahedronGeometry(0.6, 0); // 径0.6の正二十面体
                const symbolMat = new THREE.MeshPhongMaterial({
                    color: 0xffd700, // ゴールド
                    emissive: 0xffa500, // オレンジの発光
                    shininess: 100,
                    specular: 0xffffff,
                    transparent: true,
                    opacity: 0.95
                });
                const symbolMesh = new THREE.Mesh(symbolGeo, symbolMat);
                symbolMesh.name = "goalSymbol";
                symbolMesh.position.y = 0; // 中央
                goalGroup.add(symbolMesh);

                // 小さなリング状のオブジェクトも周囲に浮かべる
                const ringGeo = new THREE.TorusGeometry(1.0, 0.06, 8, 24);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0xffd700,
                    transparent: true,
                    opacity: 0.5
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.name = "goalRing";
                ringMesh.rotation.x = Math.PI / 2;
                goalGroup.add(ringMesh);

                // 2. 天井まで伸びる光の柱 (Cylinder)
                const pillarHeight = mazeConfig.wallHeight; // 3.0
                const pillarGeo = new THREE.CylinderGeometry(0.3, 0.3, pillarHeight, 16, 1, true);
                const pillarMat = new THREE.MeshBasicMaterial({
                    color: 0xffe600,
                    transparent: true,
                    opacity: 0.35,
                    blending: THREE.AdditiveBlending,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });
                const pillarMesh = new THREE.Mesh(pillarGeo, pillarMat);
                pillarMesh.name = "goalPillar";
                pillarMesh.position.y = 0; // 床から天井までの中心
                goalGroup.add(pillarMesh);

                // 3. 壁を透過してゴールの方向を示すためのゴーストビーコン (depthTest: false)
                const beaconGeo = new THREE.CylinderGeometry(0.03, 0.1, 100, 8, 1, true);
                const beaconMat = new THREE.MeshBasicMaterial({
                    color: 0xffe600,
                    transparent: true,
                    opacity: 0.08, // 非常に薄くして邪魔にならないようにする
                    blending: THREE.AdditiveBlending,
                    side: THREE.DoubleSide,
                    depthTest: false, // 壁を透過して描画
                    depthWrite: false
                });
                const beaconMesh = new THREE.Mesh(beaconGeo, beaconMat);
                beaconMesh.name = "goalBeacon";
                beaconMesh.position.y = 48; // 中心を上空に
                goalGroup.add(beaconMesh);

                // 4. ゴールを強調するローカルポイントライト
                const goalLight = new THREE.PointLight(0xffd700, 3, 8);
                goalLight.position.set(0, 0, 0);
                goalGroup.add(goalLight);

                mazeGroup.add(goalGroup);

                scene.add(mazeGroup);
                themeObjects.push(mazeGroup);

                // カメラの迷路探索用データを初期化
                camera.userData.maze = {
                    config: mazeConfig,
                    maze: maze,
                    goal: { x: mazeConfig.size - 1, y: mazeConfig.size - 1 },
                    currentCell: { x: 0, y: 0 },
                    targetCell: { x: 0, y: 0 },
                    direction: new THREE.Vector3(1, 0, 0), // 初期方向(東)
                    moveProgress: 1, 
                    moveSpeed: 0.03,
                    // --- Rotation properties ---
                    isRotating: false,
                    rotationProgress: 1,
                    rotationSpeed: 0.08, // 回転速度
                    startQuaternion: new THREE.Quaternion(),
                    targetQuaternion: new THREE.Quaternion(),
                };
                
                const startX = 0 * mazeConfig.cellSize + offset;
                const startZ = 0 * mazeConfig.cellSize + offset;
                camera.position.set(startX, 0, startZ);
                
                // Set initial rotation to look East
                camera.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), new THREE.Vector3(1, 0, 0));
                
                initMinimap();
                // --- End of Maze Refactoring ---
            } else if (theme === 'biz-red') {
                camera.position.z = 30;
                const aspectRatio = window.innerWidth / window.innerHeight;
                const width = 70 * aspectRatio;

                // 新しいヘルパー関数: 光のテクスチャを生成
                function createGlowTexture() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 128;
                    canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
                    // 中心が抜けて見えないよう、滑らかなグラデーションに変更
                    gradient.addColorStop(0, 'rgba(255,255,255,1)');
                    gradient.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, 128, 128);
                    return new THREE.CanvasTexture(canvas);
                }
                const particleTexture = createGlowTexture();

                // 共有の頂点シェーダー（リボン・ライン共通）
                const vertexShader = `
                    uniform float uTime;
                    uniform float uFrequency;
                    uniform float uSpeed;
                    uniform float uAmplitude;
                    uniform float uOffsetY;
                    uniform float uPhase;
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        pos.y += sin(pos.x * uFrequency + uTime * uSpeed + uPhase) * uAmplitude + uOffsetY;
                        pos.y += cos(pos.x * uFrequency * 2.5 - uTime * uSpeed * 0.7) * uAmplitude * 0.25;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `;

                // リボンのフラグメントシェーダー
                const ribbonFragmentShader = `
                    uniform vec3 uColor;
                    uniform float uOpacity;
                    varying vec2 vUv;
                    void main() {
                        float fade = smoothstep(0.0, 0.2, vUv.y) * (1.0 - smoothstep(0.8, 1.0, vUv.y));
                        gl_FragColor = vec4(uColor, fade * uOpacity);
                    }
                `;

                // ラインのフラグメントシェーダー
                const lineFragmentShader = `
                    uniform vec3 uColor;
                    uniform float uOpacity;
                    void main() {
                        gl_FragColor = vec4(uColor, uOpacity);
                    }
                `;

                // パーティクル（輝きの粒）の頂点シェーダー（またたき効果付き）
                const particleVertexShader = `
                    uniform float uTime;
                    uniform float uFrequency;
                    uniform float uSpeed;
                    uniform float uAmplitude;
                    uniform float uOffsetY;
                    uniform float uPhase;
                    uniform float uSize;
                    attribute float aRandom;
                    void main() {
                        vec3 pos = position;
                        pos.y += sin(pos.x * uFrequency + uTime * uSpeed + uPhase) * uAmplitude + uOffsetY;
                        pos.y += cos(pos.x * uFrequency * 2.5 - uTime * uSpeed * 0.7) * uAmplitude * 0.25;
                        pos.y += sin(pos.x * 3.0 + uTime * 1.5 + aRandom) * 0.4;
                        pos.x += cos(pos.y * 2.0 + uTime * 1.0 + aRandom) * 0.2;

                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        // またたき効果: sin波でサイズを周期的に変更
                        float flicker = 0.8 + 0.2 * sin(uTime * 2.0 + aRandom * 5.0);
                        gl_PointSize = uSize * flicker * (300.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `;

                // パーティクル（輝きの粒）のフラグメントシェーダー（テクスチャ使用）
                const particleFragmentShader = `
                    uniform vec3 uColor;
                    uniform float uOpacity;
                    uniform sampler2D uTexture;
                    void main() {
                        vec4 texColor = texture2D(uTexture, gl_PointCoord);
                        gl_FragColor = texColor * vec4(uColor, uOpacity);
                    }
                `;
                
                // 波の設定（変更なし）
                const waveConfigs = [
                    { type: 'ribbon', color: '#ffe5e5', opacity: 0.7, height: 12, frequency: 0.08, speed: 0.35, amplitude: 5.5, offsetY: -2.0, phase: 0.0 },
                    { type: 'ribbon', color: '#ff8080', opacity: 0.45, height: 8, frequency: 0.06, speed: -0.25, amplitude: 7.0, offsetY: 1.0, phase: Math.PI * 0.5 },
                    { type: 'ribbon', color: '#ff3333', opacity: 0.15, height: 5, frequency: 0.1, speed: 0.45, amplitude: 4.5, offsetY: -1.0, phase: Math.PI * 1.2 },
                    { type: 'ribbon', color: '#ffb2b2', opacity: 0.5, height: 3, frequency: 0.12, speed: -0.35, amplitude: 5.0, offsetY: 0.0, phase: Math.PI * 0.8 },
                    { type: 'line', color: '#ff1a1a', opacity: 0.5, frequency: 0.09, speed: 0.4, amplitude: 5.0, offsetY: -0.5, phase: 0.2 },
                    { type: 'line', color: '#ff6666', opacity: 0.6, frequency: 0.07, speed: -0.3, amplitude: 6.5, offsetY: 0.5, phase: Math.PI * 0.3 },
                    { type: 'line', color: '#e53e3e', opacity: 0.4, frequency: 0.11, speed: 0.55, amplitude: 4.0, offsetY: -1.5, phase: Math.PI * 0.9 }
                ];

                waveConfigs.forEach(cfg => {
                    const uniforms = { uTime: { value: 0 }, uFrequency: { value: cfg.frequency }, uSpeed: { value: cfg.speed }, uAmplitude: { value: cfg.amplitude }, uOffsetY: { value: cfg.offsetY }, uPhase: { value: cfg.phase }, uColor: { value: new THREE.Color(cfg.color) }, uOpacity: { value: cfg.opacity } };
                    if (cfg.type === 'ribbon') {
                        const geo = new THREE.PlaneGeometry(width, cfg.height, 120, 1);
                        const mat = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader: ribbonFragmentShader, transparent: true, depthWrite: false, blending: THREE.NormalBlending });
                        const mesh = new THREE.Mesh(geo, mat);
                        mesh.position.z = -1;
                        mesh.userData.isRedWaveObject = true;
                        scene.add(mesh);
                        themeObjects.push(mesh);
                    } else if (cfg.type === 'line') {
                        const vertexCount = 180, positions = [], uvs = [];
                        for (let i = 0; i <= vertexCount; i++) {
                            const ratio = i / vertexCount;
                            positions.push((ratio - 0.5) * width, 0, 0);
                            uvs.push(ratio, 0.5);
                        }
                        const geo = new THREE.BufferGeometry();
                        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                        const mat = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader: lineFragmentShader, transparent: true, depthWrite: false, blending: THREE.NormalBlending });
                        const line = new THREE.Line(geo, mat);
                        line.position.z = 0;
                        line.userData.isRedWaveObject = true;
                        scene.add(line);
                        themeObjects.push(line);
                    }
                });

                // 輝きの粒（パーティクル）の作成
                const particleCount = 150; // 加算合成なので数を少し減らす
                const positions = [], randoms = [];
                for (let i = 0; i < particleCount; i++) {
                    positions.push((Math.random() - 0.5) * width, (Math.random() - 0.5) * 6.0, 0.5);
                    randoms.push(Math.random() * 10.0);
                }
                const particleGeo = new THREE.BufferGeometry();
                particleGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                particleGeo.setAttribute('aRandom', new THREE.Float32BufferAttribute(randoms, 1));

                // パーティクルセット1
                const particleMat1 = new THREE.ShaderMaterial({
                    uniforms: { uTime: { value: 0 }, uFrequency: { value: 0.08 }, uSpeed: { value: 0.25 }, uAmplitude: { value: 5.5 }, uOffsetY: { value: -0.5 }, uPhase: { value: 0.1 }, uColor: { value: new THREE.Color('#ffffff') }, uOpacity: { value: 0.65 }, uSize: { value: 2.2 }, uTexture: { value: particleTexture } },
                    vertexShader: particleVertexShader,
                    fragmentShader: particleFragmentShader,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    depthWrite: false
                });
                const particles1 = new THREE.Points(particleGeo, particleMat1);
                particles1.userData.isRedWaveParticles = true;
                scene.add(particles1);
                themeObjects.push(particles1);

                // パーティクルセット2
                const particleMat2 = new THREE.ShaderMaterial({
                    uniforms: { uTime: { value: 0 }, uFrequency: { value: 0.06 }, uSpeed: { value: -0.2 }, uAmplitude: { value: 6.5 }, uOffsetY: { value: 0.5 }, uPhase: { value: Math.PI * 0.4 }, uColor: { value: new THREE.Color('#ffffff') }, uOpacity: { value: 0.45 }, uSize: { value: 3.2 }, uTexture: { value: particleTexture } },
                    vertexShader: particleVertexShader,
                    fragmentShader: particleFragmentShader,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    depthWrite: false
                });
                const particles2 = new THREE.Points(particleGeo.clone(), particleMat2);
                particles2.userData.isRedWaveParticles = true;
                scene.add(particles2);
                themeObjects.push(particles2);
            }
        }

        function vectorToWall(v) {
            if (v.z > 0.5) return 'down';
            if (v.z < -0.5) return 'up';
            if (v.x > 0.5) return 'right';
            if (v.x < -0.5) return 'left';
            return null;
        }

        function animate(time) {
            animFrameId = requestAnimationFrame(animate);
            const t = time ? time * 0.001 : 0;

            if (currentTheme === 'neon') {
                const gridSize = 200;
                themeObjects.forEach(obj => {
                    if (obj.userData.isWireframeObject) {
                        const { rotX, rotY, floatSpeed, floatOffset } = obj.userData;
                        obj.rotation.x += rotX;
                        obj.rotation.y += rotY;
                        obj.position.y += Math.sin(t * 0.5 + floatOffset) * floatSpeed;
                    }
                    if (obj.userData.isFlowingGrid) {
                        obj.position.z += obj.userData.speed;
                        if (obj.position.z > gridSize / 2) {
                            obj.position.z -= gridSize;
                        }
                    }
                });
            } else if (currentTheme === 'biz') {
                const particlesObject = themeObjects.find(obj => obj.userData.isParticleNetwork);
                const linesObject = themeObjects.find(obj => obj.type === 'LineSegments');

                if (particlesObject && linesObject) {
                    const particles = particlesObject.geometry.attributes.position;
                    const velocities = particlesObject.geometry.userData.velocities;
                    const particleCount = particles.count;
                    const positions = particles.array;
                    
                    const linePositions = [];
                    const connectionDistance = 5;

                    for (let i = 0; i < particleCount; i++) {
                        positions[i * 3] += velocities[i].x * 0.1;
                        positions[i * 3 + 1] += velocities[i].y * 0.1;
                        positions[i * 3 + 2] += velocities[i].z * 0.1;

                        // Wrap particles around
                        if (Math.abs(positions[i * 3]) > 25) velocities[i].x *= -1;
                        if (Math.abs(positions[i * 3 + 1]) > 15) velocities[i].y *= -1;
                        if (Math.abs(positions[i * 3 + 2]) > 15) velocities[i].z *= -1;
                        
                        // Check for connections
                        for (let j = i + 1; j < particleCount; j++) {
                            const dx = positions[i * 3] - positions[j * 3];
                            const dy = positions[i * 3 + 1] - positions[j * 3 + 1];
                            const dz = positions[i * 3 + 2] - positions[j * 3 + 2];
                            const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                            if (distance < connectionDistance) {
                                linePositions.push(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
                                linePositions.push(positions[j * 3], positions[j * 3 + 1], positions[j * 3 + 2]);
                            }
                        }
                    }
                    
                    particles.needsUpdate = true;

                    linesObject.geometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
                    linesObject.geometry.attributes.position.needsUpdate = true;
                }
            } else if (currentTheme === 'slate') {
                themeObjects.forEach(obj => {
                    if (obj.userData.isCrystal) {
                        const { rotX, rotY, floatSpeed, floatOffset } = obj.userData;
                        obj.rotation.x += rotX;
                        obj.rotation.y += rotY;
                        obj.position.y += Math.sin(t * floatSpeed + floatOffset) * 0.02;
                    }
                });
            } else if (currentTheme === 'maze' && camera.userData.maze) {
                // --- 壁の色を時間で変化させる ---
                const mazeGroup = themeObjects.find(obj => obj.userData.materials);
                if (mazeGroup) {
                    const hue = (t * 0.01) % 1; // 時間で色相を変化させる (速度調整)
                    const materials = mazeGroup.userData.materials;
                    
                    // HSLで色を更新 (彩度・輝度はテーマに合わせて調整)
                    materials.wall.color.setHSL(hue, 0.7, 0.6); // 輝度を下げて色を濃く
                    // 天井（空）の色は、明るい空のテクスチャを維持するため固定
                    
                    // 発光色も色相を追従させる (輝度は少し下げる)
                    materials.wall.emissive.setHSL(hue, 0.7, 0.4);

                    // ゴールオブジェクトのアニメーション
                    const goalGroup = mazeGroup.getObjectByName("goalGroup");
                    if (goalGroup) {
                        const symbol = goalGroup.getObjectByName("goalSymbol");
                        if (symbol) {
                            symbol.rotation.y += 0.02;
                            symbol.rotation.x += 0.01;
                            symbol.position.y = Math.sin(t * 2) * 0.15;
                        }
                        const ring = goalGroup.getObjectByName("goalRing");
                        if (ring) {
                            ring.rotation.z -= 0.015;
                            ring.position.y = Math.sin(t * 2) * 0.15;
                        }
                        const pillar = goalGroup.getObjectByName("goalPillar");
                        if (pillar) {
                            pillar.scale.x = 1 + Math.sin(t * 4) * 0.05;
                            pillar.scale.z = 1 + Math.sin(t * 4) * 0.05;
                        }
                    }
                }

                updateMinimap();

                // --- Start of Maze Animation Refactoring ---
                const mazeData = camera.userData.maze;
                const { config, maze } = mazeData;
                
                if (pointLight) {
                    pointLight.position.copy(camera.position);
                    pointLight.position.y = 0.5;
                }

                if (mazeData.isRotating) {
                    // 回転中
                    mazeData.rotationProgress = Math.min(1, mazeData.rotationProgress + mazeData.rotationSpeed);
                    THREE.Quaternion.slerp(mazeData.startQuaternion, mazeData.targetQuaternion, camera.quaternion, mazeData.rotationProgress);

                    if (mazeData.rotationProgress === 1) {
                        mazeData.isRotating = false;
                        mazeData.moveProgress = 0; // 回転完了後、移動開始
                    }
                }
                else if (mazeData.moveProgress < 1) {
                    // 移動中
                    mazeData.moveProgress = Math.min(1, mazeData.moveProgress + mazeData.moveSpeed);
                    
                    const offset = -config.size * config.cellSize / 2 + config.cellSize / 2;
                    const startX = mazeData.currentCell.x * config.cellSize + offset;
                    const startZ = mazeData.currentCell.y * config.cellSize + offset;
                    const targetX = mazeData.targetCell.x * config.cellSize + offset;
                    const targetZ = mazeData.targetCell.y * config.cellSize + offset;

                    camera.position.x = THREE.MathUtils.lerp(startX, targetX, mazeData.moveProgress);
                    camera.position.z = THREE.MathUtils.lerp(startZ, targetZ, mazeData.moveProgress);

                } else {
                    // 移動完了、次のセルを決定
                    mazeData.currentCell = { ...mazeData.targetCell };
                    const { x, y } = mazeData.currentCell;
                    
                    // --- Goal Check ---
                    if (x === mazeData.goal.x && y === mazeData.goal.y) {
                        // ゴールに到達！迷路をリセット
                        applyTheme('maze');
                        return; // このフレームの残りの処理をスキップ
                    }

                    const cell = maze[y][x];

                    // --- New Algorithm: Left-hand rule ---
                    const forwardVec = mazeData.direction.clone();
                    const leftVec = new THREE.Vector3(forwardVec.z, 0, -forwardVec.x);
                    const rightVec = new THREE.Vector3(-forwardVec.z, 0, forwardVec.x);
                    const backVec = forwardVec.clone().multiplyScalar(-1);

                    const canGo = (direction) => {
                        const wall = vectorToWall(direction);
                        // Make sure wall is a valid direction and the cell doesn't have that wall
                        return wall && !cell[wall];
                    };

                    let choice = null;

                    if (canGo(leftVec)) {
                        // 1. Turn left if possible
                        choice = { dir: leftVec, next: { x: x + leftVec.x, y: y + leftVec.z } };
                    } else if (canGo(forwardVec)) {
                        // 2. Go forward if possible
                        choice = { dir: forwardVec, next: { x: x + forwardVec.x, y: y + forwardVec.z } };
                    } else if (canGo(rightVec)) {
                        // 3. Turn right if possible
                        choice = { dir: rightVec, next: { x: x + rightVec.x, y: y + rightVec.z } };
                    } else {
                        // 4. Turn back (dead end)
                        choice = { dir: backVec, next: { x: x + backVec.x, y: y + backVec.z } };
                    }

                    if (!choice) { // Fallback, should not be reached with the logic above
                        choice = { dir: backVec, next: { x: x + backVec.x, y: y + backVec.z } };
                    }
                    // --- End of Algorithm ---

                    mazeData.targetCell = choice.next;
                    
                    const debugDiv = document.getElementById('debugInfo');
                    if (debugDiv && showDebugInfo) {
                        const q = camera.quaternion;
                        const roundVec = v => `{x:${v.x.toFixed(0)}, z:${v.z.toFixed(0)}}`;
                        debugDiv.innerHTML = `
                            Direction: ${roundVec(mazeData.direction)}<br>
                            Choice Dir: ${roundVec(choice.dir)}<br>
                            Current Cell: {x:${mazeData.currentCell.x}, y:${mazeData.currentCell.y}}<br>
                            Target Cell: {x:${mazeData.targetCell.x}, y:${mazeData.targetCell.y}}<br>
                            Quaternion: {x:${q.x.toFixed(2)}, y:${q.y.toFixed(2)}, z:${q.z.toFixed(2)}, w:${q.w.toFixed(2)}}
                        `;
                    }

                    if (!mazeData.direction.equals(choice.dir)) {
                        mazeData.direction.copy(choice.dir);
                        mazeData.isRotating = true;
                        mazeData.rotationProgress = 0;
                        mazeData.startQuaternion.copy(camera.quaternion);
                        mazeData.targetQuaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), choice.dir.clone().normalize());
                    } else {
                        mazeData.moveProgress = 0;
                    }
                }
                renderer.render(scene, camera);
                return;
                // --- End of Maze Animation Refactoring ---
            } else if (currentTheme === 'biz-red') {
                themeObjects.forEach(obj => {
                    if (obj.userData.isRedWaveObject || obj.userData.isRedWaveParticles) {
                        if (obj.material && obj.material.uniforms && obj.material.uniforms.uTime) {
                            obj.material.uniforms.uTime.value = t;
                        }
                    }
                });
            } else {
                // Default animation for 'pop' theme
                themeObjects.forEach(obj => {
                    if (obj.userData) {
                        if (obj.userData.speedY) {
                            obj.position.y += Math.sin(t + obj.userData.floatOffset) * 0.01;
                        }
                        if (obj.userData.rotX) obj.rotation.x += obj.userData.rotX;
                        if (obj.userData.rotY) obj.rotation.y += obj.userData.rotY;
                        if (obj.userData.rotZ) obj.rotation.z += obj.userData.rotZ;
                    }
                });
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }


        function playSound() {
            stopSound();
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isAudioPlaying = true;
            const icon = document.getElementById('audioIcon');
            if (icon) icon.className = 'fa-solid fa-volume-high text-lg text-emerald-500 animate-pulse';

            if (currentSoundType === 'pop') {
                playPopMelody();
            } else if (currentSoundType === 'chirp') {
                playChirpAmbience();
            } else if (currentSoundType === 'lofi') {
                playDeepAmbient();
            }
        }

        function playPopMelody() {
            const notes = [523.25, 587.33, 659.25, 783.99, 880.00];
            let step = 0;

            activeAudioInterval = setInterval(() => {
                if (!isAudioPlaying || !audioCtx) return;
                const freq = notes[step % notes.length];
                step++;

                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.42);
                } catch(e) {}
            }, 500);
        }

        function playChirpAmbience() {
            activeAudioInterval = setInterval(() => {
                if (!isAudioPlaying || !audioCtx) return;
                if (Math.random() > 0.5) {
                    try {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        const startFreq = 2200 + Math.random() * 800;

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(startFreq + 500, audioCtx.currentTime + 0.1);

                        gain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.13);
                    } catch(e) {}
                }
            }, 700);
        }

        function playDeepAmbient() {
            const chord = [130.81, 164.81, 196.00, 246.94];
            let idx = 0;

            activeAudioInterval = setInterval(() => {
                if (!isAudioPlaying || !audioCtx) return;
                const freq = chord[idx % chord.length];
                idx++;

                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + 1.25);
                } catch(e) {}

        }

        function generateMaze(width, height) {
            const maze = Array(height).fill(null).map((_, y) => Array(width).fill(null).map((_, x) => ({
                up: true, down: true, left: true, right: true, visited: false, x, y
            })));

            function carve(cx, cy) {
                const cell = maze[cy][cx];
                cell.visited = true;

                const directions = [{x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0}];
                directions.sort(() => Math.random() - 0.5);

                for (const { x: dx, y: dy } of directions) {
                    const nx = cx + dx;
                    const ny = cy + dy;

                    if (nx >= 0 && ny >= 0 && nx < width && ny < height && !maze[ny][nx].visited) {
                        if (dx === 1) { // Move right
                            cell.right = false;
                            maze[ny][nx].left = false;
                        } else if (dx === -1) { // Move left
                            cell.left = false;
                            maze[ny][nx].right = false;
                        } else if (dy === 1) { // Move down
                            cell.down = false;
                            maze[ny][nx].up = false;
                        } else if (dy === -1) { // Move up
                            cell.up = false;
                            maze[ny][nx].down = false;
                        }
                        carve(nx, ny);
                    }
                }
            }

            carve(0, 0);
            return maze;
        }

        function resizeMinimap() {
            // We only care about resizing if the maze theme is active
            if (!document.body.classList.contains('theme-maze')) {
                return;
            }

            const canvas = document.getElementById('minimapCanvas');
            if (!canvas) return;

            let newSize;
            if (window.innerWidth <= 480) {
                newSize = 80;
            } else if (window.innerWidth <= 768) {
                newSize = 120;
            } else {
                newSize = 160;
            }

            if (canvas.width !== newSize) {
                canvas.width = newSize;
                canvas.height = newSize;
                
                // initMinimap will handle getting the new context and redrawing the base map
                if (camera && camera.userData.maze) {
                    // Update global reference if needed, although initMinimap does this.
                    minimapCanvas = canvas; 
                    initMinimap();
                }
            }
        }

        function initMinimap() {
            if (!minimapCanvas) {
                minimapCanvas = document.getElementById('minimapCanvas');
                if (minimapCanvas) {
                    minimapCtx = minimapCanvas.getContext('2d');
                }
            }
            if (!minimapCtx || !camera.userData.maze) return;

            const { maze, config } = camera.userData.maze;
            const size = config.size;
            const canvasSize = minimapCanvas.width;
            const mapCellSize = canvasSize / size;

            minimapCtx.clearRect(0, 0, canvasSize, canvasSize);

            // Draw walls
            minimapCtx.strokeStyle = 'rgba(15, 23, 42, 0.5)';
            minimapCtx.lineWidth = 1.5;
            minimapCtx.beginPath();
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const cell = maze[y][x];
                    const mx = x * mapCellSize;
                    const my = y * mapCellSize;

                    if (cell.up) {
                        minimapCtx.moveTo(mx, my);
                        minimapCtx.lineTo(mx + mapCellSize, my);
                    }
                    if (cell.left) {
                        minimapCtx.moveTo(mx, my);
                        minimapCtx.lineTo(mx, my + mapCellSize);
                    }
                }
            }
            minimapCtx.stroke();
            
            // Draw border
            minimapCtx.strokeRect(0, 0, canvasSize, canvasSize);
        }

        function updateMinimap() {
            if (!minimapCtx || !camera.userData.maze) return;

            const { maze, config, currentCell, goal } = camera.userData.maze;
            const size = config.size;
            const canvasSize = minimapCanvas.width;
            const mapCellSize = canvasSize / size;

            initMinimap(); // Redraw walls every frame to clear previous player/goal positions

            const halfCell = mapCellSize / 2;

            // Draw goal
            minimapCtx.fillStyle = 'rgba(255, 215, 0, 0.9)';
            minimapCtx.beginPath();
            minimapCtx.arc(goal.x * mapCellSize + halfCell, goal.y * mapCellSize + halfCell, halfCell * 0.7, 0, Math.PI * 2);
            minimapCtx.fill();

            // Draw player
            minimapCtx.fillStyle = 'rgba(239, 68, 68, 0.9)';
            minimapCtx.beginPath();
            minimapCtx.arc(currentCell.x * mapCellSize + halfCell, currentCell.y * mapCellSize + halfCell, halfCell * 0.6, 0, Math.PI * 2);
            minimapCtx.fill();
        }

        window.applyTheme = function(themeKey) {
            currentTheme = themeKey;

            // Update body class cleanly
            document.body.classList.remove('theme-pop', 'theme-neon', 'theme-biz', 'theme-slate', 'theme-biz-red');
            document.body.classList.add(`theme-${themeKey}`);

            // Synchronize 3D point light
            if (pointLight) {
                const lightColors = {
                    'pop': 0xff70a6,
                    'neon': 0x00f5d4,
                    'biz': 0x38bdf8,
                    'slate': 0x94a3b8,
                    'maze': 0x0ea5e9,
                    'biz-red': 0xff477e
                };
                pointLight.color.setHex(lightColors[themeKey] || 0xff70a6);

                if (themeKey === 'maze') {
                    pointLight.intensity = 4;
                    pointLight.distance = 25;
                } else {
                    pointLight.intensity = 2;
                    pointLight.distance = 50;
                }
            }

            const labelMap = {
                'pop': 'ポップ＆パステル 🍬',
                'neon': 'ネオン＆サイバー ⚡',
                'biz': 'ビジネス＆コーポレート 💼',
                'slate': 'ミニマル＆シック 🏛️',
                'biz-red': 'ビジネスレッドウェーブ 🌺'
            };

            const dropdownLabelMap = {
                'pop': 'ポップ＆パステル',
                'neon': 'ネオン＆サイバー',
                'biz': 'ビジネス＆コーポレート',
                'slate': 'ミニマル＆シック',
                'biz-red': 'ビジネスレッドウェーブ'
            };

            const currentThemeLabel = document.getElementById('currentThemeLabel');
            if (currentThemeLabel) currentThemeLabel.innerText = dropdownLabelMap[themeKey] || 'ポップ＆パステル';

            const bgThemeName = document.getElementById('bgThemeName');
            if (bgThemeName) bgThemeName.innerText = `背景: ${labelMap[themeKey] || 'ポップ＆パステル'}`;

            // Highlight active menu item
            document.querySelectorAll('.theme-select-option').forEach(opt => {
                if (opt.getAttribute('data-theme') === themeKey) {
                    opt.classList.add('bg-black/10', 'dark:bg-white/20');
                } else {
                    opt.classList.remove('bg-black/10', 'dark:bg-white/20');
                }
            });

            createThemeObjects(themeKey);

            if (themeKey === 'maze' && camera) {
                // When switching to maze theme, ensure camera user data is re-initialized by createThemeObjects
                // The re-initialization logic is now inside createThemeObjects for maze theme
            }

            // Set correct size on theme change
            resizeMinimap();
        };

        function updateFullscreenIcon() {
            const doc = document;
            const fsElement = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;
            const isPseudo = document.body.classList.contains('is-pseudo-fullscreen');
            const fsBtnIcon = document.querySelector('#fullscreenBtn i');

            if (fsBtnIcon) {
                if (fsElement || isPseudo) {
                    fsBtnIcon.className = 'fa-solid fa-compress text-lg';
                } else {
                    fsBtnIcon.className = 'fa-solid fa-expand text-lg';
                }
            }
        }

        function toggleFullscreen() {
            const doc = document;
            const docEl = document.documentElement;

            const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
            const exitFS = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
            const fsElement = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;

            if (!fsElement && !document.body.classList.contains('is-pseudo-fullscreen')) {
                if (requestFS) {
                    try {
                        const promise = requestFS.call(docEl);
                        if (promise && promise.then) {
                            promise.catch(() => {
                                togglePseudoFullscreen();
                            });
                        }
                    } catch (e) {
                        togglePseudoFullscreen();
                    }
                } else {
                    togglePseudoFullscreen();
                }
            } else {
                if (document.body.classList.contains('is-pseudo-fullscreen')) {
                    togglePseudoFullscreen();
                } else if (exitFS) {
                    try {
                        const promise = exitFS.call(doc);
                        if (promise && promise.then) {
                            promise.catch(() => {
                                togglePseudoFullscreen();
                            });
                        }
                    } catch (e) {
                        togglePseudoFullscreen();
                    }
                } else {
                    togglePseudoFullscreen();
                }
            }
        }

        function togglePseudoFullscreen() {
            document.body.classList.toggle('is-pseudo-fullscreen');
            updateFullscreenIcon();
        }

        function initApp() {
            // 初期状態の10分後をクイック時間選択の最初のボタンに設定
            const defaultPresetBtn = document.querySelector('.preset-btn[data-time]');
            if (defaultPresetBtn) {
                const defaultTimeStr = `${String(targetHour).padStart(2, '0')}:${String(targetMinute).padStart(2, '0')}`;
                defaultPresetBtn.setAttribute('data-time', defaultTimeStr);
                defaultPresetBtn.innerText = defaultTimeStr;
            }

            setTargetTime(targetHour, targetMinute);
            initThreeJS();
            window.applyTheme(currentTheme);
            animate();

            // Start timer updates
            setInterval(updateClock, 1000);
            updateClock();

            // Handle Screen Resize
            window.addEventListener('resize', () => {
                if (camera && renderer) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
                resizeMinimap();
            });

            // Mouse move tracking for interactive elements
            window.addEventListener('mousemove', (event) => {
                mousePos.x = (event.clientX / window.innerWidth) * 2 - 1;
                mousePos.y = - (event.clientY / window.innerHeight) * 2 + 1;
            }, { passive: true });

            // Theme Dropdown Toggle & Event Delegation
            const themeBtn = document.getElementById('themeDropdownBtn');
            const themeMenu = document.getElementById('themeMenu');

            if (themeBtn && themeMenu) {
                themeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    themeMenu.classList.toggle('hidden');
                });

                // Robust event delegation for theme menu clicks
                themeMenu.addEventListener('click', (e) => {
                    const option = e.target.closest('.theme-select-option');
                    if (option) {
                        e.stopPropagation();
                        e.preventDefault();
                        const themeKey = option.getAttribute('data-theme');
                        if (themeKey) {
                            window.applyTheme(themeKey);
                        }
                        themeMenu.classList.add('hidden');
                    }
                });

                document.addEventListener('click', (e) => {
                    if (!themeMenu.contains(e.target) && !themeBtn.contains(e.target)) {
                        themeMenu.classList.add('hidden');
                    }
                });
            }



            // Modal Controls
            const modal = document.getElementById('settingsModal');
            const container = document.getElementById('modalContainer');

            function openModal() {
                if (!modal || !container) return;
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    container.classList.remove('scale-95');
                    container.classList.add('scale-100');
                }, 10);
            }

            function closeModal() {
                if (!modal || !container) return;
                modal.classList.add('opacity-0');
                container.classList.remove('scale-100');
                container.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }

            const settingsBtn = document.getElementById('settingsBtn');
            if (settingsBtn) settingsBtn.addEventListener('click', openModal);

            const closeSettingsBtn = document.getElementById('closeSettingsBtn');
            if (closeSettingsBtn) closeSettingsBtn.addEventListener('click', closeModal);

            const saveSettingsClose = document.getElementById('saveSettingsClose');
            if (saveSettingsClose) saveSettingsClose.addEventListener('click', closeModal);

            // Time Input Change Event
            const timeInput = document.getElementById('timeInput');
            if (timeInput) {
                timeInput.addEventListener('input', (e) => {
                    const val = e.target.value;
                    if (val) {
                        const [h, m] = val.split(':').map(Number);
                        setTargetTime(h, m);
                    }
                });
            }

            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const target = e.currentTarget;
                    const timeVal = target.getAttribute('data-time');
                    const addVal = target.getAttribute('data-add');

                    if (timeVal) {
                        const [h, m] = timeVal.split(':').map(Number);
                        setTargetTime(h, m);
                    } else if (addVal) {
                        const now = new Date();
                        const future = new Date(now.getTime() + parseInt(addVal, 10) * 60000);
                        setTargetTime(future.getHours(), future.getMinutes());
                    }
                });
            });

            // Text Inputs
            const mainMsgInput = document.getElementById('mainMsgInput');
            if (mainMsgInput) {
                mainMsgInput.addEventListener('input', (e) => {
                    updateMainMessage(e.target.value);
                });
            }


            const subMsgInput = document.getElementById('subMsgInput');
            if (subMsgInput) {
                subMsgInput.addEventListener('input', (e) => {
                    document.getElementById('subMessageText').innerText = e.target.value;
                });
            }



            // Maze Debug Toggle
            const debugToggle = document.getElementById('debugToggle');
            const debugInfoDiv = document.getElementById('debugInfo');
            if (debugToggle && debugInfoDiv) {
                debugToggle.checked = showDebugInfo;
                debugInfoDiv.classList.toggle('hidden', !showDebugInfo);

                debugToggle.addEventListener('change', (e) => {
                    showDebugInfo = e.target.checked;
                    debugInfoDiv.classList.toggle('hidden', !showDebugInfo);
                });
            }

            // Fullscreen Toggle
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    toggleFullscreen();
                });
            }

            // Synchronize fullscreen icon on browser-level fullscreen change
            document.addEventListener('fullscreenchange', updateFullscreenIcon);
            document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);
            document.addEventListener('mozfullscreenchange', updateFullscreenIcon);
            document.addEventListener('MSFullscreenChange', updateFullscreenIcon);

            // Set initial size
            resizeMinimap();
        }

        // Safe script execution
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
    <div id="debugInfo" class="fixed bottom-0 left-0 bg-black/50 text-white text-xs p-2 font-mono z-50 hidden" style="pointer-events: none;"></div>

    <!-- Maze Minimap -->
    <div id="minimapContainer" class="fixed bottom-4 left-4 z-20 p-2 rounded-2xl shadow-lg transition-opacity duration-500 opacity-0 pointer-events-none">
        <canvas id="minimapCanvas" width="160" height="160"></canvas>
    </div>
</body>
</html>
