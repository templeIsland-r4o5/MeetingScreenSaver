    <script>
        // Global State Variables
        const initialTarget = new Date(Date.now() + 10 * 60 * 1000);
        let targetHour = initialTarget.getHours();
        let targetMinute = initialTarget.getMinutes();
        let currentTheme = 'slate';

        let scene, camera, renderer, pointLight;
        let themeObjects = [];
        let animFrameId = null;



        function updateClock() {
            const now = new Date();
            
            // Format current time display
            const ch = String(now.getHours()).padStart(2, '0');
            const cm = String(now.getMinutes()).padStart(2, '0');
            const cs = String(now.getSeconds()).padStart(2, '0');
            const timeElem = document.getElementById('currentTimeDisplay');
            if (timeElem) timeElem.innerText = `${ch}:${cm}:${cs}`;

            // Target time calculation
            const target = new Date();
            target.setHours(targetHour, targetMinute, 0, 0);

            let diff = target.getTime() - now.getTime();
            const countElem = document.getElementById('countdownDisplay');
            if (!countElem) return;

            if (diff <= 0) {
                countElem.innerText = "00:00";
            } else {
                const totalSec = Math.floor(diff / 1000);
                const hours = Math.floor(totalSec / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60;

                if (hours > 0) {
                    countElem.innerText = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
                } else {
                    countElem.innerText = `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
                }
            }
        }

        function setTargetTime(h, m) {
            targetHour = parseInt(h, 10);
            targetMinute = parseInt(m, 10);
            
            const hStr = String(targetHour).padStart(2, '0');
            const mStr = String(targetMinute).padStart(2, '0');
            const timeStr = `${hStr}:${mStr}`;

            const timeInput = document.getElementById('timeInput');
            if (timeInput) {
                timeInput.value = timeStr;
            }

            const mainMessageText = `${timeStr}から再開します。`;

            const mainMessage = document.getElementById('mainMessage');
            if (mainMessage) {
                mainMessage.innerText = mainMessageText;
            }

            const mainMsgInput = document.getElementById('mainMsgInput');
            if (mainMsgInput) {
                mainMsgInput.value = mainMessageText;
            }

            document.title = `${timeStr}から再開します - 休憩中スクリーン`;

            updateClock();
        }

        function initThreeJS() {
            const canvas = document.getElementById('bgCanvas');
            if (!canvas) return;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Ambient & Directional Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            pointLight = new THREE.PointLight(0x94a3b8, 2, 50);
            pointLight.position.set(-10, -10, 10);
            scene.add(pointLight);
        }

        function clearThemeObjects() {
            themeObjects.forEach(obj => {
                scene.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) {
                        obj.material.forEach(m => m.dispose());
                    } else {
                        obj.material.dispose();
                    }
                }
            });
            themeObjects = [];
        }

        let mousePos = new THREE.Vector2();

        function createThemeObjects(theme) {
            if (!scene) return;
            clearThemeObjects();
            camera.position.z = 30; // Reset camera position for all themes
            const aspectRatio = window.innerWidth / window.innerHeight;

            if (theme === 'pop') {
                const colors = [0xff70a6, 0xff9f1c, 0xffd166, 0x06d6a0, 0x118ab2, 0xa2d2ff];
                const sphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
                const torusGeo = new THREE.TorusGeometry(1.5, 0.5, 16, 32);
                const spreadX = 35 * aspectRatio;
                const spreadY = 35;

                for (let i = 0; i < 35; i++) {
                    const color = colors[i % colors.length];
                    const mat = new THREE.MeshPhongMaterial({
                        color: color,
                        shininess: 90,
                        specular: 0xffffff,
                        transparent: true,
                        opacity: 0.85
                    });

                    const useTorus = (i % 4 === 0);
                    const mesh = new THREE.Mesh(useTorus ? torusGeo : sphereGeo, mat);

                    mesh.position.set(
                        (Math.random() - 0.5) * spreadX,
                        (Math.random() - 0.5) * spreadY,
                        (Math.random() - 0.5) * 30
                    );

                    const scale = 0.6 + Math.random() * 1.2;
                    mesh.scale.set(scale, scale, scale);

                    mesh.userData = {
                        speedY: 0.005 + Math.random() * 0.012,
                        rotX: (Math.random() - 0.5) * 0.02,
                        rotY: (Math.random() - 0.5) * 0.02,
                        initialY: mesh.position.y,
                        floatOffset: Math.random() * Math.PI * 2
                    };

                    scene.add(mesh);
                    themeObjects.push(mesh);
                }
            } else if (theme === 'neon') {
                camera.position.z = 40; // カメラを少し引く
                const spreadX = 30 * aspectRatio;
                const spreadY = 30;

                // 浮遊するワイヤーフレームオブジェクト
                const geoTypes = [
                    new THREE.TorusGeometry(8, 1, 16, 32),
                    new THREE.IcosahedronGeometry(6, 0),
                    new THREE.TorusKnotGeometry(6, 0.8, 100, 8),
                ];
                const colors = [0x42a5f5, 0xd436f7, 0x00f5d4];

                for(let i=0; i<8; i++) {
                    const mat = new THREE.MeshBasicMaterial({
                        color: colors[i % colors.length],
                        wireframe: true,
                        transparent: true,
                        opacity: 0.5 + Math.random() * 0.3
                    });
                    const mesh = new THREE.Mesh(geoTypes[i % geoTypes.length], mat);

                // 流れるグリッド

                    `,

            } else if (theme === 'biz') {
                const spreadX = 30 * aspectRatio;

                // Particle Network
                const particleCount = 120;
                const particlesGeo = new THREE.BufferGeometry();

                for (let i = 0; i < particleCount; i++) {

                    velocities.push({

                    });
                }
                particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
                particlesGeo.userData.velocities = velocities;

                const pMat = new THREE.PointsMaterial({

                const particles = new THREE.Points(particlesGeo, pMat);
                particles.userData.isParticleNetwork = true;
                scene.add(particles);
                themeObjects.push(particles);

                // Lines geometry
                const lineGeo = new THREE.BufferGeometry();

                });
                const lines = new THREE.LineSegments(lineGeo, lineMat);
                scene.add(lines);
                themeObjects.push(lines);

                // Add a soft floor grid
                const gridHelper = new THREE.GridHelper(80, 40, 0x818cf8, 0x818cf8);
                gridHelper.position.y = -18;
                gridHelper.material.opacity = 0.1;
                gridHelper.material.transparent = true;
                scene.add(gridHelper);
                themeObjects.push(gridHelper);

            } else if (theme === 'slate') {
                const spreadX = 30 * aspectRatio;
                const spreadY = 30;
                // Floating Crystals
                const crystalGeo = new THREE.IcosahedronGeometry(1, 0);
                const crystalMat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,

                });

                for (let i = 0; i < 25; i++) {

                    mesh.position.set(

                    );

                    const scale = 0.5 + Math.random() * 1.5;
                    mesh.scale.set(scale, scale, scale);

                    mesh.userData = {
                        isCrystal: true,
                        rotX: (Math.random() - 0.5) * 0.005,

                        floatSpeed: 0.1 + Math.random() * 0.2,
                        floatOffset: Math.random() * Math.PI * 2
                    };

                    scene.add(mesh);
                    themeObjects.push(mesh);
                }
            } else if (theme === 'biz-red') {
                camera.position.z = 30;
                const aspectRatio = window.innerWidth / window.innerHeight;
                const width = 70 * aspectRatio;

                // 新しいヘルパー関数: 光のテクスチャを生成
                function createGlowTexture() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 128;
                    canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
                    // 中心が抜けて見えないよう、滑らかなグラデーションに変更
                    gradient.addColorStop(0, 'rgba(255,255,255,1)');
                    gradient.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, 128, 128);
                    return new THREE.CanvasTexture(canvas);
                }
                const particleTexture = createGlowTexture();

                // 共有の頂点シェーダー（リボン・ライン共通）
                const vertexShader = `
                    uniform float uTime;
                    uniform float uFrequency;
                    uniform float uSpeed;
                    uniform float uAmplitude;
                    uniform float uOffsetY;
                    uniform float uPhase;
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        pos.y += sin(pos.x * uFrequency + uTime * uSpeed + uPhase) * uAmplitude + uOffsetY;
                        pos.y += cos(pos.x * uFrequency * 2.5 - uTime * uSpeed * 0.7) * uAmplitude * 0.25;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `;

                // リボンのフラグメントシェーダー
                const ribbonFragmentShader = `
                    uniform vec3 uColor;
                    uniform float uOpacity;
                    varying vec2 vUv;
                    void main() {
                        float fade = smoothstep(0.0, 0.2, vUv.y) * (1.0 - smoothstep(0.8, 1.0, vUv.y));
                        gl_FragColor = vec4(uColor, fade * uOpacity);
                    }
                `;

                // ラインのフラグメントシェーダー
                const lineFragmentShader = `
                    uniform vec3 uColor;
                    uniform float uOpacity;
                    void main() {
                        gl_FragColor = vec4(uColor, uOpacity);
                    }
                `;

                // パーティクル（輝きの粒）の頂点シェーダー（またたき効果付き）
                const particleVertexShader = `
                    uniform float uTime;
                    uniform float uFrequency;
                    uniform float uSpeed;
                    uniform float uAmplitude;
                    uniform float uOffsetY;
                    uniform float uPhase;
                    uniform float uSize;
                    attribute float aRandom;
                    void main() {
                        vec3 pos = position;
                        pos.y += sin(pos.x * uFrequency + uTime * uSpeed + uPhase) * uAmplitude + uOffsetY;
                        pos.y += cos(pos.x * uFrequency * 2.5 - uTime * uSpeed * 0.7) * uAmplitude * 0.25;
                        pos.y += sin(pos.x * 3.0 + uTime * 1.5 + aRandom) * 0.4;
                        pos.x += cos(pos.y * 2.0 + uTime * 1.0 + aRandom) * 0.2;

                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        // またたき効果: sin波でサイズを周期的に変更
                        float flicker = 0.8 + 0.2 * sin(uTime * 2.0 + aRandom * 5.0);
                        gl_PointSize = uSize * flicker * (300.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `;

                // パーティクル（輝きの粒）のフラグメントシェーダー（テクスチャ使用）
                const particleFragmentShader = `
                    uniform vec3 uColor;
                    uniform float uOpacity;
                    uniform sampler2D uTexture;
                    void main() {
                        vec4 texColor = texture2D(uTexture, gl_PointCoord);
                        gl_FragColor = texColor * vec4(uColor, uOpacity);
                    }
                `;
                
                // 波の設定（変更なし）
                const waveConfigs = [
                    { type: 'ribbon', color: '#ffe5e5', opacity: 0.7, height: 12, frequency: 0.08, speed: 0.35, amplitude: 5.5, offsetY: -2.0, phase: 0.0 },
                    { type: 'ribbon', color: '#ff8080', opacity: 0.45, height: 8, frequency: 0.06, speed: -0.25, amplitude: 7.0, offsetY: 1.0, phase: Math.PI * 0.5 },
                    { type: 'ribbon', color: '#ff3333', opacity: 0.15, height: 5, frequency: 0.1, speed: 0.45, amplitude: 4.5, offsetY: -1.0, phase: Math.PI * 1.2 },
                    { type: 'ribbon', color: '#ffb2b2', opacity: 0.5, height: 3, frequency: 0.12, speed: -0.35, amplitude: 5.0, offsetY: 0.0, phase: Math.PI * 0.8 },
                    { type: 'line', color: '#ff1a1a', opacity: 0.5, frequency: 0.09, speed: 0.4, amplitude: 5.0, offsetY: -0.5, phase: 0.2 },
                    { type: 'line', color: '#ff6666', opacity: 0.6, frequency: 0.07, speed: -0.3, amplitude: 6.5, offsetY: 0.5, phase: Math.PI * 0.3 },
                    { type: 'line', color: '#e53e3e', opacity: 0.4, frequency: 0.11, speed: 0.55, amplitude: 4.0, offsetY: -1.5, phase: Math.PI * 0.9 }
                ];

                waveConfigs.forEach(cfg => {
                    const uniforms = { uTime: { value: 0 }, uFrequency: { value: cfg.frequency }, uSpeed: { value: cfg.speed }, uAmplitude: { value: cfg.amplitude }, uOffsetY: { value: cfg.offsetY }, uPhase: { value: cfg.phase }, uColor: { value: new THREE.Color(cfg.color) }, uOpacity: { value: cfg.opacity } };
                    if (cfg.type === 'ribbon') {
                        const geo = new THREE.PlaneGeometry(width, cfg.height, 120, 1);
                        const mat = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader: ribbonFragmentShader, transparent: true, depthWrite: false, blending: THREE.NormalBlending });
                        const mesh = new THREE.Mesh(geo, mat);
                        mesh.position.z = -1;
                        mesh.userData.isRedWaveObject = true;
                        scene.add(mesh);
                        themeObjects.push(mesh);
                    } else if (cfg.type === 'line') {
                        const vertexCount = 180, positions = [], uvs = [];
                        for (let i = 0; i <= vertexCount; i++) {
                            const ratio = i / vertexCount;
                            positions.push((ratio - 0.5) * width, 0, 0);
                            uvs.push(ratio, 0.5);
                        }
                        const geo = new THREE.BufferGeometry();
                        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
                        const mat = new THREE.ShaderMaterial({ uniforms, vertexShader, fragmentShader: lineFragmentShader, transparent: true, depthWrite: false, blending: THREE.NormalBlending });
                        const line = new THREE.Line(geo, mat);
                        line.position.z = 0;
                        line.userData.isRedWaveObject = true;
                        scene.add(line);
                        themeObjects.push(line);
                    }
                });

                // 輝きの粒（パーティクル）の作成
                const particleCount = 150; // 加算合成なので数を少し減らす
                const positions = [], randoms = [];
                for (let i = 0; i < particleCount; i++) {
                    positions.push((Math.random() - 0.5) * width, (Math.random() - 0.5) * 6.0, 0.5);
                    randoms.push(Math.random() * 10.0);
                }
                const particleGeo = new THREE.BufferGeometry();
                particleGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                particleGeo.setAttribute('aRandom', new THREE.Float32BufferAttribute(randoms, 1));

                // パーティクルセット1
                const particleMat1 = new THREE.ShaderMaterial({
                    uniforms: { uTime: { value: 0 }, uFrequency: { value: 0.08 }, uSpeed: { value: 0.25 }, uAmplitude: { value: 5.5 }, uOffsetY: { value: -0.5 }, uPhase: { value: 0.1 }, uColor: { value: new THREE.Color('#ffffff') }, uOpacity: { value: 0.65 }, uSize: { value: 2.2 }, uTexture: { value: particleTexture } },
                    vertexShader: particleVertexShader,
                    fragmentShader: particleFragmentShader,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    depthWrite: false
                });
                const particles1 = new THREE.Points(particleGeo, particleMat1);
                particles1.userData.isRedWaveParticles = true;
                scene.add(particles1);
                themeObjects.push(particles1);

                // パーティクルセット2
                const particleMat2 = new THREE.ShaderMaterial({
                    uniforms: { uTime: { value: 0 }, uFrequency: { value: 0.06 }, uSpeed: { value: -0.2 }, uAmplitude: { value: 6.5 }, uOffsetY: { value: 0.5 }, uPhase: { value: Math.PI * 0.4 }, uColor: { value: new THREE.Color('#ffffff') }, uOpacity: { value: 0.45 }, uSize: { value: 3.2 }, uTexture: { value: particleTexture } },
                    vertexShader: particleVertexShader,
                    fragmentShader: particleFragmentShader,
                    blending: THREE.AdditiveBlending,
                    transparent: true,
                    depthWrite: false
                });
                const particles2 = new THREE.Points(particleGeo.clone(), particleMat2);
                particles2.userData.isRedWaveParticles = true;
                scene.add(particles2);
                themeObjects.push(particles2);
            }
        }

        function animate(time) {
            animFrameId = requestAnimationFrame(animate);
            const t = time ? time * 0.001 : 0;

            if (currentTheme === 'neon') {
                const gridSize = 200;
                themeObjects.forEach(obj => {
                    if (obj.userData.isWireframeObject) {
                        const { rotX, rotY, floatSpeed, floatOffset } = obj.userData;
                        obj.rotation.x += rotX;
                        obj.rotation.y += rotY;
                        obj.position.y += Math.sin(t * 0.5 + floatOffset) * floatSpeed;
                    }
                    if (obj.userData.isFlowingGrid) {
                        obj.position.z += obj.userData.speed;
                        if (obj.position.z > gridSize / 2) {
                            obj.position.z -= gridSize;
                        }
                    }
                });
            } else if (currentTheme === 'biz') {
                const particlesObject = themeObjects.find(obj => obj.userData.isParticleNetwork);
                const linesObject = themeObjects.find(obj => obj.type === 'LineSegments');

                if (particlesObject && linesObject) {
                    const particles = particlesObject.geometry.attributes.position;
                    const velocities = particlesObject.geometry.userData.velocities;
                    const particleCount = particles.count;
                    const positions = particles.array;
                    
                    const linePositions = [];
                    const connectionDistance = 5;

                    for (let i = 0; i < particleCount; i++) {
                        positions[i * 3] += velocities[i].x * 0.1;
                        positions[i * 3 + 1] += velocities[i].y * 0.1;
                        positions[i * 3 + 2] += velocities[i].z * 0.1;

                        // Wrap particles around
                        if (Math.abs(positions[i * 3]) > 25) velocities[i].x *= -1;
                        if (Math.abs(positions[i * 3 + 1]) > 15) velocities[i].y *= -1;
                        if (Math.abs(positions[i * 3 + 2]) > 15) velocities[i].z *= -1;
                        
                        // Check for connections
                        for (let j = i + 1; j < particleCount; j++) {
                            const dx = positions[i * 3] - positions[j * 3];
                            const dy = positions[i * 3 + 1] - positions[j * 3 + 1];
                            const dz = positions[i * 3 + 2] - positions[j * 3 + 2];
                            const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                            if (distance < connectionDistance) {
                                linePositions.push(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]);
                                linePositions.push(positions[j * 3], positions[j * 3 + 1], positions[j * 3 + 2]);
                            }
                        }
                    }
                    
                    particles.needsUpdate = true;

                    linesObject.geometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
                    linesObject.geometry.attributes.position.needsUpdate = true;
                }
            } else if (currentTheme === 'slate') {
                themeObjects.forEach(obj => {
                    if (obj.userData.isCrystal) {
                        const { rotX, rotY, floatSpeed, floatOffset } = obj.userData;
                        obj.rotation.x += rotX;
                        obj.rotation.y += rotY;
                        obj.position.y += Math.sin(t * floatSpeed + floatOffset) * 0.02;
                    }
                });
            } else if (currentTheme === 'biz-red') {
                themeObjects.forEach(obj => {
                    if (obj.userData.isRedWaveObject || obj.userData.isRedWaveParticles) {
                        if (obj.material && obj.material.uniforms && obj.material.uniforms.uTime) {
                            obj.material.uniforms.uTime.value = t;
                        }
                    }
                });
            } else {
                // Default animation for 'pop' theme
                themeObjects.forEach(obj => {
                    if (obj.userData) {
                        if (obj.userData.speedY) {
                            obj.position.y += Math.sin(t + obj.userData.floatOffset) * 0.01;
                        }
                        if (obj.userData.rotX) obj.rotation.x += obj.userData.rotX;
                        if (obj.userData.rotY) obj.rotation.y += obj.userData.rotY;
                        if (obj.userData.rotZ) obj.rotation.z += obj.userData.rotZ;
                    }
                });
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }



        window.applyTheme = function(themeKey) {
            currentTheme = themeKey;

            // Update body class cleanly
            document.body.classList.remove('theme-pop', 'theme-neon', 'theme-biz', 'theme-slate', 'theme-biz-red');
            document.body.classList.add(`theme-${themeKey}`);

            // Synchronize 3D point light
            if (pointLight) {
                const lightColors = {
                    'pop': 0xff70a6,
                    'neon': 0x00f5d4,
                    'biz': 0x38bdf8,
                    'slate': 0x94a3b8,
                    'biz-red': 0xff477e
                };
                pointLight.color.setHex(lightColors[themeKey] || 0xff70a6);
            }

            const labelMap = {
                'pop': 'ポップ＆パステル 🍬',
                'neon': 'ネオン＆サイバー ⚡',
                'biz': 'ビジネス＆コーポレート 💼',
                'slate': 'ミニマル＆シック 🏛️',
                'biz-red': 'ビジネスレッドウェーブ 🌺'
            };

            const dropdownLabelMap = {
                'pop': 'ポップ＆パステル',
                'neon': 'ネオン＆サイバー',
                'biz': 'ビジネス＆コーポレート',
                'slate': 'ミニマル＆シック',
                'biz-red': 'ビジネスレッドウェーブ'
            };

            const currentThemeLabel = document.getElementById('currentThemeLabel');
            if (currentThemeLabel) currentThemeLabel.innerText = dropdownLabelMap[themeKey] || 'ポップ＆パステル';

            const bgThemeName = document.getElementById('bgThemeName');
            if (bgThemeName) bgThemeName.innerText = `背景: ${labelMap[themeKey] || 'ポップ＆パステル'}`;

            // Highlight active menu item
            document.querySelectorAll('.theme-select-option').forEach(opt => {
                if (opt.getAttribute('data-theme') === themeKey) {
                    opt.classList.add('bg-black/10', 'dark:bg-white/20');
                } else {
                    opt.classList.remove('bg-black/10', 'dark:bg-white/20');
                }
            });

            createThemeObjects(themeKey);
        };

        function updateFullscreenIcon() {
            const doc = document;
            const fsElement = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;
            const isPseudo = document.body.classList.contains('is-pseudo-fullscreen');
            const fsBtnIcon = document.querySelector('#fullscreenBtn i');

            if (fsBtnIcon) {
                if (fsElement || isPseudo) {
                    fsBtnIcon.className = 'fa-solid fa-compress text-lg';
                } else {
                    fsBtnIcon.className = 'fa-solid fa-expand text-lg';
                }
            }
        }

        function toggleFullscreen() {
            const doc = document;
            const docEl = document.documentElement;

            const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
            const exitFS = doc.exitFullscreen || doc.webkitExitFullscreen || doc.mozCancelFullScreen || doc.msExitFullscreen;
            const fsElement = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;

            if (!fsElement && !document.body.classList.contains('is-pseudo-fullscreen')) {
                if (requestFS) {
                    try {
                        const promise = requestFS.call(docEl);
                        if (promise && promise.then) {
                            promise.catch(() => {
                                togglePseudoFullscreen();
                            });
                        }
                    } catch (e) {
                        togglePseudoFullscreen();
                    }
                } else {
                    togglePseudoFullscreen();
                }
            } else {
                if (document.body.classList.contains('is-pseudo-fullscreen')) {
                    togglePseudoFullscreen();
                } else if (exitFS) {
                    try {
                        const promise = exitFS.call(doc);
                        if (promise && promise.then) {
                            promise.catch(() => {
                                togglePseudoFullscreen();
                            });
                        }
                    } catch (e) {
                        togglePseudoFullscreen();
                    }
                } else {
                    togglePseudoFullscreen();
                }
            }
        }

        function togglePseudoFullscreen() {
            document.body.classList.toggle('is-pseudo-fullscreen');
            updateFullscreenIcon();
        }

        function initApp() {
            // 初期状態の10分後をクイック時間選択の最初のボタンに設定
            const defaultPresetBtn = document.querySelector('.preset-btn[data-time]');
            if (defaultPresetBtn) {
                const defaultTimeStr = `${String(targetHour).padStart(2, '0')}:${String(targetMinute).padStart(2, '0')}`;
                defaultPresetBtn.setAttribute('data-time', defaultTimeStr);
                defaultPresetBtn.innerText = defaultTimeStr;
            }

            setTargetTime(targetHour, targetMinute);
            initThreeJS();
            window.applyTheme(currentTheme);
            animate();

            // Start timer updates
            setInterval(updateClock, 1000);
            updateClock();

            // Handle Screen Resize
            window.addEventListener('resize', () => {
                if (camera && renderer) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });

            // Mouse move tracking for interactive elements
            window.addEventListener('mousemove', (event) => {
                mousePos.x = (event.clientX / window.innerWidth) * 2 - 1;
                mousePos.y = - (event.clientY / window.innerHeight) * 2 + 1;
            }, { passive: true });

            // Theme Dropdown Toggle & Event Delegation
            const themeBtn = document.getElementById('themeDropdownBtn');
            const themeMenu = document.getElementById('themeMenu');

            if (themeBtn && themeMenu) {
                themeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    themeMenu.classList.toggle('hidden');
                });

                // Robust event delegation for theme menu clicks
                themeMenu.addEventListener('click', (e) => {
                    const option = e.target.closest('.theme-select-option');
                    if (option) {
                        e.stopPropagation();
                        e.preventDefault();
                        const themeKey = option.getAttribute('data-theme');
                        if (themeKey) {
                            window.applyTheme(themeKey);
                        }
                        themeMenu.classList.add('hidden');
                    }
                });

                document.addEventListener('click', (e) => {
                    if (!themeMenu.contains(e.target) && !themeBtn.contains(e.target)) {
                        themeMenu.classList.add('hidden');
                    }
                });
            }



            // Modal Controls
            const modal = document.getElementById('settingsModal');
            const container = document.getElementById('modalContainer');

            function openModal() {
                if (!modal || !container) return;
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    container.classList.remove('scale-95');
                    container.classList.add('scale-100');
                }, 10);
            }

            function closeModal() {
                if (!modal || !container) return;
                modal.classList.add('opacity-0');
                container.classList.remove('scale-100');
                container.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }

            const settingsBtn = document.getElementById('settingsBtn');
            if (settingsBtn) settingsBtn.addEventListener('click', openModal);

            const closeSettingsBtn = document.getElementById('closeSettingsBtn');
            if (closeSettingsBtn) closeSettingsBtn.addEventListener('click', closeModal);

            const saveSettingsClose = document.getElementById('saveSettingsClose');
            if (saveSettingsClose) saveSettingsClose.addEventListener('click', closeModal);

            // Time Input Change Event
            const timeInput = document.getElementById('timeInput');
            if (timeInput) {
                timeInput.addEventListener('input', (e) => {
                    const val = e.target.value;
                    if (val) {
                        const [h, m] = val.split(':').map(Number);
                        setTargetTime(h, m);
                    }
                });
            }

            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const target = e.currentTarget;
                    const timeVal = target.getAttribute('data-time');
                    const addVal = target.getAttribute('data-add');

                    if (timeVal) {
                        const [h, m] = timeVal.split(':').map(Number);
                        setTargetTime(h, m);
                    } else if (addVal) {
                        const now = new Date();
                        const future = new Date(now.getTime() + parseInt(addVal, 10) * 60000);
                        setTargetTime(future.getHours(), future.getMinutes());
                    }
                });
            });

            // Text Inputs
            const mainMsgInput = document.getElementById('mainMsgInput');
            if (mainMsgInput) {
                mainMsgInput.addEventListener('input', (e) => {
                    document.getElementById('mainMessage').innerText = e.target.value;
                });
            }

            const subMsgInput = document.getElementById('subMsgInput');
            if (subMsgInput) {
                subMsgInput.addEventListener('input', (e) => {
                    document.getElementById('subMessageText').innerText = e.target.value;
                });
            }



            // Fullscreen Toggle
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    toggleFullscreen();
                });
            }

            // Synchronize fullscreen icon on browser-level fullscreen change
            document.addEventListener('fullscreenchange', updateFullscreenIcon);
            document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);
            document.addEventListener('mozfullscreenchange', updateFullscreenIcon);
            document.addEventListener('MSFullscreenChange', updateFullscreenIcon);
        }

        // Safe script execution
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
